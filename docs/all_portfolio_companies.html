const LAST=new Set(['Work at a Startup','Angellist / Wellfound','LinkedIn','Company Website','Paraform','Indeed']);
let fil=[...D],pg=1,sc=null,sd=1;
function ac(a){{const m={{'Greenhouse':'bg','Ashby':'ba','Lever':'bl','Workday':'bw','Rippling':'br','Comeet':'bc','BambooHR':'bb','Teamtailor':'bt','LinkedIn':'bln','Workable':'bwk','Gem':'bgm','Dover':'bd'}};return m[a]||'bdf';}}
function jc(n){{return n===0?'j0':n<10?'jl':n<50?'jm':n<200?'jh':'jv';}}
function vt(v){{const m={{'a16z':'va','Sequoia':'vs','Lightspeed':'vl','BVP':'vb','Greylock':'vg'}};return v.split(',').map(x=>x.trim()).map(x=>'<span class="vt '+(m[x]||'')+'">'+x+'</span>').join('');}}
function render(){{
  const ps=document.getElementById('pageSize').value;
  const isAll=ps==='all';
  const psi=isAll?fil.length:parseInt(ps);
  const start=(pg-1)*psi;
  const page=fil.slice(start,start+psi);
  const sj=document.getElementById('sortJobs').value;
  const isGrp=sj===''&&!sc;
  let h='',la=null;
  page.forEach(r=>{{
    if(isGrp&&r.A!==la){{
      const gc=fil.filter(x=>x.A===r.A).length;
      h+='<tr><td class="gh" colspan="6">'+r.A+'<span class="gc">'+gc+' companies &middot; '+fil.filter(x=>x.A===r.A).reduce((s,x)=>s+x.J,0).toLocaleString()+' roles</span></td></tr>';
      la=r.A;
    }}
    const al=r.U?'<a href="'+r.U+'" target="_blank">Open &rarr;</a>':'—';
    h+='<tr><td class="cn">'+r.C+'</td><td class="dm">'+(r.D||'')+'</td><td><span class="ab '+ac(r.A)+'">'+r.A+'</span></td><td class="jb '+jc(r.J)+'">'+r.J.toLocaleString()+'</td><td>'+al+'</td><td><div class="vtags">'+vt(r.V)+'</div></td></tr>';
  }});
  document.getElementById('tb').innerHTML=h;
  const tj=fil.reduce((s,r)=>s+r.J,0);
  document.getElementById('sbar').innerHTML='<span>Showing <strong>'+fil.length+'</strong> / <strong>'+D.length+'</strong></span><span>Roles: <strong>'+tj.toLocaleString()+'</strong></span>';
  if(!isAll)rPag(psi); else document.getElementById('pag').innerHTML='';
  document.getElementById('nr').style.display=fil.length?'none':'block';
}}
function rPag(psi){{
  const tot=Math.ceil(fil.length/psi);
  const p=document.getElementById('pag');
  if(tot<=1){{p.innerHTML='';return;}}
  let ps2=[];
  if(tot<=9)for(let i=1;i<=tot;i++)ps2.push(i);
  else{{ps2=[1];if(pg>3)ps2.push('...');for(let i=Math.max(2,pg-2);i<=Math.min(tot-1,pg+2);i++)ps2.push(i);if(pg<tot-3)ps2.push('...');ps2.push(tot);}}
  let h='<button class="pb" onclick="gP('+(pg-1)+')" '+(pg===1?'disabled':'')+'>&lsaquo;</button>';
  ps2.forEach(x=>{{h+=x==='...'?'<span style="color:#334;padding:0 4px">&hellip;</span>':'<button class="pb '+(x===pg?'active':'')+'" onclick="gP('+x+')">'+x+'</button>';}});
  h+='<button class="pb" onclick="gP('+(pg+1)+')" '+(pg===tot?'disabled':'')+'>&rsaquo;</button>';
  p.innerHTML=h;
}}
function gP(x){{const ps=document.getElementById('pageSize').value;const psi=ps==='all'?fil.length:parseInt(ps);pg=Math.max(1,Math.min(x,Math.ceil(fil.length/psi)));render();}}
function af(){{
  const q=document.getElementById('search').value.toLowerCase();
  const at=document.getElementById('atsFilter').value;
  const vc=document.getElementById('vcFilter').value;
  const sj=document.getElementById('sortJobs').value;
  fil=D.filter(r=>{{
    if(q&&!r.C.toLowerCase().includes(q)&&!r.D.toLowerCase().includes(q)&&!r.A.toLowerCase().includes(q))return false;
    if(at&&r.A!==at)return false;
    if(vc&&!r.V.includes(vc))return false;
    return true;
  }});
  if(sj==='desc')fil.sort((a,b)=>b.J-a.J);
  else if(sj==='asc')fil.sort((a,b)=>a.J-b.J);
  else if(sj==='az')fil.sort((a,b)=>a.C.localeCompare(b.C));
  else if(sc)fil.sort((a,b)=>sc==='J'?(a.J-b.J)*sd:String(a[sc]).localeCompare(String(b[sc]))*sd);
  else fil.sort((a,b)=>{{const ao=LAST.has(a.A)?1:0,bo=LAST.has(b.A)?1:0;if(ao!==bo)return ao-bo;if(a.A!==b.A)return a.A.localeCompare(b.A);return b.J-a.J;}});
  pg=1;render();
}}
function sBy(c){{
  ['C','D','A','J','V'].forEach(x=>{{const e=document.getElementById('th'+x);if(e)e.className='';}});
  if(sc===c)sd*=-1;else{{sc=c;sd=1;}}
  const e=document.getElementById('th'+c);if(e)e.className=sd===1?'asc':'desc';
  document.getElementById('sortJobs').value='';
  af();
}}
['search','atsFilter','vcFilter','sortJobs'].forEach(id=>{{
  document.getElementById(id).addEventListener(id==='search'?'input':'change',()=>{{sc=null;['C','D','A','J','V'].forEach(x=>{{const e=document.getElementById('th'+x);if(e)e.className='';}});af();}});
}});
document.getElementById('pageSize').addEventListener('change',()=>{{pg=1;render();}});
af();
