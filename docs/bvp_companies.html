function atsClass(ats) {
  const map = {
    'Greenhouse': 'ats-greenhouse', 'Ashby': 'ats-ashby', 'Lever': 'ats-lever',
    'Workday': 'ats-workday', 'Rippling': 'ats-rippling', 'Comeet': 'ats-comeet',

    'SmartRecruiters': 'ats-smartrecruiters', 'LinkedIn': 'ats-linkedin', 'N/A': 'ats-na'
  };
  return map[ats] || 'ats-default';
}

function jobClass(n) {
  if (n === 0) return 'jobs-0';
  if (n < 10) return 'jobs-low';
  if (n < 50) return 'jobs-mid';
  if (n < 150) return 'jobs-high';
  return 'jobs-very-high';
}

  const tbody = document.getElementById('tbody');

function renderPagination(ps) {
  const total = Math.ceil(filtered.length / ps);
  const pag = document.getElementById('pagination');
  if (total <= 1) { pag.innerHTML = ''; return; }
  let html = '';
  const range = (s, e) => { let r = []; for(let i=s;i<=e;i++) r.push(i); return r; };
  let pages = [];
  if (total <= 7) pages = range(1, total);
  else {
    pages = [1];
    if (currentPage > 3) pages.push('...');
    const s = Math.max(2, currentPage-1), e = Math.min(total-1, currentPage+1);
    pages = pages.concat(range(s, e));
    if (currentPage < total - 2) pages.push('...');
    pages.push(total);
  }
  html += ;
  pages.forEach(p => {
    if (p === '...') html += ;
    else html += ;
  });
  html += ;
  pag.innerHTML = html;
}

function goPage(p) {
  const ps = parseInt(document.getElementById('pageSize').value);
  const total = Math.ceil(filtered.length / ps);
  currentPage = Math.max(1, Math.min(p, total));
  render();
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const ats = document.getElementById('atsFilter').value;
  const own = document.getElementById('ownFilter').value;
  const sortJ = document.getElementById('sortJobs').value;

  filtered = DATA.filter(r => {
    if (q && !r.C.toLowerCase().includes(q) && !r.D.toLowerCase().includes(q) && !r.A.toLowerCase().includes(q)) return false;
    if (ats && r.A !== ats) return false;
    if (own && r.O !== own) return false;
    return true;
  });

  if (sortJ === 'desc') filtered.sort((a,b) => b.J - a.J);
  else if (sortJ === 'asc') filtered.sort((a,b) => a.J - b.J);
  else if (sortCol) {
    filtered.sort((a,b) => {
      let av = a[sortCol], bv = b[sortCol];
      if (sortCol === 'J') return (av - bv) * sortDir;
      return av.localeCompare(bv) * sortDir;
    });
  }
  currentPage = 1;
  render();
}

function sortBy(col) {
  ['C','D','A','J'].forEach(c => {
    document.getElementById('th-'+c).className = '';
  });
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
  document.getElementById('th-'+col).className = sortDir === 1 ? 'sorted-asc' : 'sorted-desc';
  applyFilters();
}

document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('atsFilter').addEventListener('change', applyFilters);
document.getElementById('ownFilter').addEventListener('change', applyFilters);
document.getElementById('sortJobs').addEventListener('change', applyFilters);
document.getElementById('pageSize').addEventListener('change', () => { currentPage = 1; render(); });

applyFilters();
