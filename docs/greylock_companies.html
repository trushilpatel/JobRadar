<!DOCTYPE html>

<title>Greylock Portfolio Companies</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0a0a0a; color: #e0e0e0; }

  .header h1 span { color: #4dcc4d; }
  .header p { color: #668866; font-size: 0.85rem; margin-top: 4px; }
  .controls { display: flex; gap: 12px; padding: 16px 32px; background: #111; border-bottom: 1px solid #222; flex-wrap: wrap; align-items: center; }
  .search-box { flex: 1; min-width: 200px; position: relative; }
  .search-box input { width: 100%; padding: 8px 12px 8px 36px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #e0e0e0; font-size: 0.875rem; outline: none; transition: border-color 0.2s; }

  select { padding: 8px 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #e0e0e0; font-size: 0.875rem; cursor: pointer; outline: none; }
  select:focus { border-color: #4dcc4d; }
  .stats { display: flex; gap: 20px; padding: 12px 32px; background: #0d0d0d; border-bottom: 1px solid #1a1a1a; font-size: 0.8rem; color: #667; flex-wrap: wrap; }
  .stats span { color: #aab; }
  .stats strong { color: #4dcc4d; }

  thead th.sorted-desc::after { content: " dn"; color: #4dcc4d; }

  .ats-ashby { background: #1a0d2d; color: #a07dff; border: 1px solid #3d1a6e; }
  .ats-lever { background: #2d1a0d; color: #ff8c42; border: 1px solid #6e3d1a; }
  .ats-workday { background: #0d1a2d; color: #4a9eff; border: 1px solid #1a3d6e; }
  .ats-rippling { background: #2d1a0d; color: #ffcc42; border: 1px solid #6e4a1a; }
  .ats-comeet { background: #1a2d0d; color: #7dd94a; border: 1px solid #3d6e1a; }
  .ats-bamboohr { background: #2d0d1a; color: #ff6b9d; border: 1px solid #6e1a3d; }
  .ats-linkedin { background: #0d1a30; color: #4a90d9; border: 1px solid #1a3d6e; }
  .ats-gem { background: #1a2d0d; color: #aad94a; border: 1px solid #4a6e1a; }
  .ats-dover { background: #2d0d2d; color: #cc7dff; border: 1px solid #6e1a6e; }
  .ats-na { background: #1a1a1a; color: #555; border: 1px solid #333; }
  .ats-default { background: #1a1a2a; color: #8899cc; border: 1px solid #333; }
  td.jobs { text-align: right; font-variant-numeric: tabular-nums; }
  .jobs-0 { color: #444; }
  .jobs-low { color: #7777aa; }
  .jobs-mid { color: #4a9eff; }
  .jobs-high { color: #3ddc7a; font-weight: 600; }

  else{pg=[1];if(currentPage>3)pg.push('...');for(let i=Math.max(2,currentPage-1);i<=Math.min(tot-1,currentPage+1);i++)pg.push(i);if(currentPage<tot-2)pg.push('...');pg.push(tot);}
  let h='<button class="page-btn" onclick="goP('+(currentPage-1)+')" '+(currentPage===1?'disabled':'')+'>&lsaquo;</button>';
  pg.forEach(p=>{h+=p==='...'?'<span style="color:#556;padding:0 4px">&hellip;</span>':'<button class="page-btn '+(p===currentPage?'active':'')+'" onclick="goP('+p+')">'+p+'</button>';});
  h+='<button class="page-btn" onclick="goP('+(currentPage+1)+')" '+(currentPage===tot?'disabled':'')+'>&rsaquo;</button>';
  pag.innerHTML=h;
}
function goP(p){const ps=parseInt(document.getElementById('pageSize').value);currentPage=Math.max(1,Math.min(p,Math.ceil(filtered.length/ps)));render();}
function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase();
  const at=document.getElementById('atsFilter').value;
  const ow=document.getElementById('ownFilter').value;
  const sj=document.getElementById('sortJobs').value;
  filtered=DATA.filter(r=>{
    if(q&&!r.C.toLowerCase().includes(q)&&!r.D.toLowerCase().includes(q)&&!r.A.toLowerCase().includes(q))return false;
    if(at&&r.A!==at)return false;
    if(ow&&r.O!==ow)return false;
    return true;
  });
  if(sj==='desc')filtered.sort((a,b)=>b.J-a.J);
  else if(sj==='asc')filtered.sort((a,b)=>a.J-b.J);
  else if(sortCol)filtered.sort((a,b)=>sortCol==='J'?(a.J-b.J)*sortDir:a[sortCol].localeCompare(b[sortCol])*sortDir);
  currentPage=1;render();
}
function sortBy(c){
  ['C','D','A','J'].forEach(x=>document.getElementById('th-'+x).className='');
  if(sortCol===c)sortDir*=-1;else{sortCol=c;sortDir=1;}
  document.getElementById('th-'+c).className=sortDir===1?'sorted-asc':'sorted-desc';
  applyFilters();
}
['search','atsFilter','ownFilter','sortJobs'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',applyFilters));
document.getElementById('pageSize').addEventListener('change',()=>{currentPage=1;render();});
applyFilters();
</script>
</body>
</html>
