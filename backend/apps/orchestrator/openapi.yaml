components:
  schemas:
    CreateNodeResponse:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        last_seen_at:
          format: date-time
          type:
            - string
            - "null"
        name:
          type: string
        online:
          type: boolean
        status:
          type: string
        token:
          type: string
      required:
        - token
        - id
        - name
        - status
        - online
        - last_seen_at
        - created_at
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
      type: object
    ErrorRequest:
      additionalProperties: false
      properties:
        adapter_type:
          type: string
        assignment_id:
          type: string
        company_id:
          type: string
        duration_ms:
          format: int64
          type: integer
        error_message:
          type: string
      type: object
    JobContent:
      additionalProperties: false
      properties:
        compensation:
          type: string
        department:
          type: string
        description:
          type: string
        published_date:
          type: string
        requirements:
          type: string
        workplace_type:
          type: string
      required:
        - description
        - requirements
        - compensation
        - workplace_type
        - department
        - published_date
      type: object
    JobSummary:
      additionalProperties: false
      properties:
        adapter:
          type: string
        all_locations:
          items:
            type: string
          type:
            - array
            - "null"
        company_id:
          type: string
        employ_type:
          type: string
        id:
          type: string
        job_content:
          $ref: "#/components/schemas/JobContent"
        location:
          type: string
        location_known:
          type: boolean
        title:
          type: string
        url:
          type: string
      required:
        - id
        - company_id
        - adapter
        - title
        - location
        - url
        - employ_type
      type: object
    NodeView:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        last_seen_at:
          format: date-time
          type:
            - string
            - "null"
        name:
          type: string
        online:
          type: boolean
        status:
          type: string
      required:
        - id
        - name
        - status
        - online
        - last_seen_at
        - created_at
      type: object
    ProvisionNodeRequest:
      additionalProperties: false
      properties:
        name:
          type: string
      type: object
    ResponseCreateNodeResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/CreateNodeResponse"
      required:
        - data
      type: object
    ResponseListNodeView:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/NodeView"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    ResponseResultsResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ResultsResponse"
      required:
        - data
      type: object
    ResponseStruct {}:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ResponseStruct {}DataStruct"
      required:
        - data
      type: object
    ResponseStruct {}DataStruct:
      additionalProperties: false
      type: object
    ResponseWorkResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/WorkResponse"
      required:
        - data
      type: object
    ResultsRequest:
      additionalProperties: false
      properties:
        adapter_type:
          type: string
        assignment_id:
          type: string
        company_id:
          type: string
        duration_ms:
          format: int64
          type: integer
        fetched_count:
          format: int64
          type: integer
        final:
          type: boolean
        jobs:
          items:
            $ref: "#/components/schemas/JobSummary"
          type:
            - array
            - "null"
      type: object
    ResultsResponse:
      additionalProperties: false
      properties:
        completed:
          type: boolean
        new:
          format: int64
          type: integer
        published:
          format: int64
          type: integer
        removed:
          format: int64
          type: integer
      required:
        - published
        - new
        - removed
        - completed
      type: object
    ServiceError:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
      required:
        - error
      type: object
    SetNodeStatusRequest:
      additionalProperties: false
      properties:
        status:
          type: string
      type: object
    WorkResponse:
      additionalProperties: false
      properties:
        assignment:
          $ref: "#/components/schemas/WorkUnit"
        heartbeat_acked:
          items:
            type: string
          type:
            - array
            - "null"
        heartbeat_missed:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - assignment
        - heartbeat_acked
        - heartbeat_missed
      type: object
    WorkUnit:
      additionalProperties: false
      properties:
        adapter_config:
          type:
            - string
            - "null"
        adapter_type:
          type: string
        company_id:
          type: string
        id:
          type: string
        source:
          type: string
      required:
        - id
        - company_id
        - adapter_type
        - adapter_config
        - source
      type: object
info:
  title: jobradar-orchestrator
  version: 1.0.0
openapi: 3.1.0
paths:
  /admin/crawler-nodes/:
    get:
      operationId: listCrawlerNodes
      parameters:
        - description: Filter by node status
          explode: false
          in: query
          name: status
          schema:
            description: Filter by node status
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseListNodeView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
          description: Error
      summary: List crawler nodes
      tags:
        - crawler-nodes
    post:
      operationId: provisionCrawlerNode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionNodeRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseCreateNodeResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
          description: Error
      summary: Provision a new crawler node
      tags:
        - crawler-nodes
  /admin/crawler-nodes/{id}:
    delete:
      operationId: retireCrawlerNode
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
          description: Error
      summary: Retire a crawler node
      tags:
        - crawler-nodes
    patch:
      operationId: setCrawlerNodeStatus
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetNodeStatusRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseStruct {}"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
          description: Error
      summary: Set a crawler node's status
      tags:
        - crawler-nodes
  /node/error:
    post:
      operationId: reportError
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
          description: Error
      summary: Report a crawl error for an assignment
      tags:
        - node
  /node/results:
    post:
      operationId: submitResults
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseResultsResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
          description: Error
      summary: Submit crawl results for an assignment
      tags:
        - node
  /node/work:
    get:
      operationId: getWork
      parameters:
        - description: Adapter type filter; omit to claim any available type
          explode: false
          in: query
          name: adapter
          schema:
            description: Adapter type filter; omit to claim any available type
            type: string
        - description: Comma-separated lease IDs the node currently holds
          explode: false
          in: query
          name: holding
          schema:
            description: Comma-separated lease IDs the node currently holds
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseWorkResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
          description: Error
      summary: Claim work for the calling crawler node
      tags:
        - node
