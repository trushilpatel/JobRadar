        dlq:
          format: int64
          type: integer
      required:
        - 1m
        - 10m
        - 1h
        - dlq
      type: object
    ScanRun:
      additionalProperties: false
      properties:
        company_id:
          type: string
        duration_ms:
          format: int64
          type:
            - integer
            - "null"
        error:
          type:
            - string
            - "null"
        jobs_fetched:
          format: int64
          type: integer
        jobs_new:
          format: int64
          type: integer
        scanned_at:
          format: date-time
          type: string
      required:
        - company_id
        - scanned_at
        - jobs_fetched
        - jobs_new
        - error
        - duration_ms
      type: object
    ScanStats:
      additionalProperties: false
      properties:
        avg_duration_ms:
          format: double
          type:
            - number
            - "null"
        error_count:
          format: int64
          type: integer
        new_this_month:
          format: int64
          type: integer
        new_today:
          format: int64
          type: integer
        recent_runs:
          items:
            $ref: "#/components/schemas/ScanRun"
          type:
            - array
            - "null"
        total_fetched:
          format: int64
          type: integer
        total_new:
          format: int64
          type: integer
        total_scans:
          format: int64
          type: integer
      required:
        - total_scans
        - total_fetched
        - total_new
        - error_count
        - avg_duration_ms
        - new_today
        - new_this_month
        - recent_runs
      type: object
    ServiceError:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
      required:
        - error
      type: object
    SetAllActiveInputBody:
      additionalProperties: false
      properties:
        active:
          type: boolean
      required:
        - active
      type: object
    SetNotesInput:
      additionalProperties: false
      properties:
        notes:
          type: string
      type: object
    SetResumeInput:
      additionalProperties: false
      properties:
        resume_id:
          type:
            - string
            - "null"
      type: object
    SetSavedInputBody:
      additionalProperties: false
