          in: query
          name: adapter_type
          schema:
            description: Singular adapter type filter, used when adapter_types is absent
            type: string
        - description: true or false
          explode: false
          in: query
          name: active
          schema:
            description: true or false
            type: string
        - description: true or false
          explode: false
          in: query
          name: has_settings
          schema:
            description: true or false
            type: string
        - description: ILIKE match on company name
          explode: false
          in: query
          name: search
          schema:
            description: ILIKE match on company name
            type: string
        - explode: false
          in: query
          name: sort_by
          schema:
            type: string
        - description: asc or desc
          explode: false
          in: query
          name: sort_dir
          schema:
            description: asc or desc
            type: string
        - description: ok, error, queued, or running
          explode: false
          in: query
          name: scan_status
          schema:
            description: ok, error, queued, or running
            type: string
        - description: Opaque keyset pagination cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque keyset pagination cursor
            type: string
        - description: Page size 1-100; invalid or missing values default to 20
          explode: false
          in: query
          name: limit
          schema:
            description: Page size 1-100; invalid or missing values default to 20
            examples:
              - "20"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
