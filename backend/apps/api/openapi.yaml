        status:
          type: string
      type: object
    StageResponse:
      additionalProperties: false
      properties:
        app_id:
          type: string
        stage:
          type: string
      required:
        - app_id
        - stage
      type: object
    TriggerRetryInput:
      additionalProperties: false
      properties:
        tier:
          type: string
        worker:
          type: string
      type: object
    TriggerRetryResult:
      additionalProperties: false
