          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseATSDTO"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
          description: Error
      summary: Get an ATS adapter by name
      tags:
        - ats
    patch:
      operationId: updateAts
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateATSInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseATSDTO"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
          description: Error
      summary: Update an ATS adapter
      tags:
        - ats
  /admin/companies:
