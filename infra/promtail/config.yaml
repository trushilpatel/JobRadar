server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}

scrape_configs:
  # Caddy JSON access logs
  - job_name: caddy
    static_configs:
      - targets:
          - localhost
        labels:
          job: caddy
          host: ${HOST_NAME:-jobradar}
          service: caddy
          __path__: /var/log/caddy/*.log
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            request_host: request.host
            request_uri: request.uri
            request_method: request.method
            status: status
            remote_ip: request.remote_ip
      - labels:
          request_host:
          status:
      - timestamp:
          source: ts
          format: Unix

  # Docker container logs via docker socket
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['service']
        target_label: 'job'
      - target_label: 'host'
        replacement: ${HOST_NAME:-jobradar}
      - source_labels: ['container_name']
        regex: 'jobradar_loki|jobradar_promtail|jobradar_grafana'
        action: drop
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            service: service
      - labels:
          level:

  # CrowdSec logs (if tailed from host)
  - job_name: crowdsec
    static_configs:
      - targets:
          - localhost
        labels:
          job: crowdsec
          host: ${HOST_NAME:-jobradar}
          service: crowdsec
          __path__: /var/log/crowdsec*.log
