<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>JobRadar — Jobs redesign mockup v2</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0a0a10; color:#e5e7eb; font-family: ui-sans-serif, system-ui, sans-serif; }
  .scrollbar-thin::-webkit-scrollbar { width:8px; height:8px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background:#ffffff14; border-radius:4px; }

  body.show-boundaries .cmp-outline { outline:1px dashed #7c3aed66; outline-offset:-1px; position:relative; }
  body.show-boundaries .cmp-outline[data-label]::after {
    content: attr(data-label);
    position:absolute; top:4px; right:6px;
    font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    background:#7c3aed; color:#fff; padding:2px 6px; border-radius:4px;
    font-family: ui-monospace, monospace; z-index:50; pointer-events:none;
  }

  .filter-pill {
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; padding:6px 10px; border-radius:8px;
    border:1px solid; transition:all .12s; white-space:nowrap; cursor:pointer;
  }
  .filter-pill.off  { background:#ffffff08; border-color:#ffffff14; color:#94a3b8; }
  .filter-pill.off:hover { background:#ffffff14; color:#e2e8f0; }
  .filter-pill.on   { background:rgba(124,58,237,.15); border-color:rgba(124,58,237,.35); color:#c4b5fd; }
  .filter-pill.on.emerald { background:rgba(16,185,129,.12); border-color:rgba(16,185,129,.3); color:#6ee7b7; }
  .filter-pill.on.amber { background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.3); color:#fcd34d; }

  .group-sep { width:1px; height:22px; background:#ffffff14; margin:0 4px; flex-shrink:0; }
  .group-label { font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:#64748b; margin-right:4px; align-self:center; }
</style>
</head>
<body class="min-h-screen">

<main class="flex min-h-screen">

  <!-- LIST (flex, takes remaining space; shrinks when panel opens) -->
  <section class="cmp-outline flex-1 min-w-0 flex flex-col" data-label="JobList">

    <!-- ========== Inline header ========== -->
    <div class="flex items-center justify-between px-6 py-3 border-b border-white/[0.07]">
      <div class="flex items-baseline gap-3">
        <h1 class="text-lg font-semibold">Jobs</h1>
        <span class="text-xs text-slate-400">248 jobs · <span class="text-violet-300">3 selected filters</span></span>
      </div>
      <div class="flex items-center gap-1.5">
        <button class="p-1.5 rounded-lg bg-white/5 border border-white/10 text-slate-400 hover:text-white" title="Refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
    </div>

    <!-- ========== Status tabs: New / Saved / Applied / Interviewing / Offer ========== -->
    <div class="flex items-center gap-0.5 px-6 pt-2 border-b border-white/[0.07] overflow-x-auto">
      <button data-tab="new"          class="tab active"  >New          <span class="count active">42</span></button>
      <button data-tab="saved"        class="tab"         >Saved        <span class="count">8</span></button>
      <button data-tab="applied"      class="tab"         >Applied      <span class="count">3</span></button>
      <button data-tab="interviewing" class="tab"         >Interviewing <span class="count">2</span></button>
      <button data-tab="offer"        class="tab"         >Offer        <span class="count">1</span></button>
    </div>

    <!-- ========== FILTER BAR — single row, all visible ========== -->
    <div class="cmp-outline px-6 py-3 border-b border-white/[0.07]" data-label="JobFilters">
      <div class="flex items-center gap-2 flex-wrap">

        <!-- Search -->
        <div class="relative">
          <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input placeholder="Search…" class="pl-7 pr-3 py-1.5 text-xs bg-white/5 border border-white/10 rounded-lg placeholder-slate-500 focus:outline-none focus:border-violet-500 w-48"/>
        </div>

        <!-- Company multi-select (dropdown because it's a list of N) -->
        <button class="filter-pill off">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14"/></svg>
          All companies
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>

        <span class="group-sep"></span>

        <!-- Experience — individual pills, each toggleable -->
        <button data-f class="filter-pill on">0–2 yrs</button>
        <button data-f class="filter-pill on">3–5 yrs</button>
        <button data-f class="filter-pill off">5+ yrs</button>

        <span class="group-sep"></span>

        <!-- Date posted -->
        <button data-f class="filter-pill on">Any</button>
        <button data-f class="filter-pill off">7d</button>
        <button data-f class="filter-pill off">30d</button>

        <span class="group-sep"></span>

        <!-- Location -->
        <button data-f class="filter-pill on emerald">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
          Remote
        </button>
        <button data-f class="filter-pill off">On-site</button>

        <span class="group-sep"></span>

        <!-- Reset -->
        <button class="text-[11px] text-slate-500 hover:text-slate-300 px-2">Reset</button>
      </div>
    </div>

    <!-- ========== Table ========== -->
    <div class="flex-1 overflow-y-auto scrollbar-thin">
      <table class="w-full text-sm">
        <thead class="sticky top-0 bg-[#0d0d14] border-b border-white/[0.07] text-[11px] uppercase tracking-wider text-slate-500">
          <tr>
            <th class="text-left px-6 py-2 w-10"><input type="checkbox" class="accent-violet-500"/></th>
            <th class="text-left px-2 py-2">Company</th>
            <th class="text-left px-2 py-2">Title</th>
            <th class="text-left px-2 py-2">Location</th>
            <th class="text-left px-2 py-2">Salary</th>
            <th class="text-left px-2 py-2">Added</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <!-- Drag handle (only when panel open) -->
  <div id="dragHandle" class="w-1 shrink-0 cursor-col-resize bg-white/[0.06] hover:bg-violet-500/50 hidden"></div>

  <!-- DETAIL PANEL — hidden by default, shown when row clicked -->
  <aside id="detailPanel" class="cmp-outline w-[440px] shrink-0 border-l border-white/[0.07] bg-[#0d0d14] flex-col min-h-0 hidden" data-label="JobDetailPanel">
    <div id="detailContent" class="flex flex-col h-full"></div>
  </aside>
</main>

<style>
  .tab { padding:8px 14px; font-size:13px; font-weight:500; color:#94a3b8; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
  .tab:hover { color:#fff; }
  .tab.active { color:#c4b5fd; border-bottom-color:#8b5cf6; background:rgba(139,92,246,.05); }
  .count { font-size:10px; padding:2px 7px; border-radius:999px; background:#ffffff0f; color:#64748b; }
  .count.active { background:rgba(139,92,246,.2); color:#c4b5fd; }
</style>

<script>
const JOBS = [
  { id:'1', company:'Anthropic', title:'Senior Software Engineer — Agents', location:'San Francisco, CA', remote:true,  salary:'$220k – $320k', added:'3h ago', exp:'3–5 yrs', visa:'Sponsors', summary:'Build agentic systems that reason, plan, and use tools at scale. Work on claude.ai and developer APIs.', stack:['Python','TypeScript','React','PostgreSQL','Kafka'], resp:['Design and ship agent tooling','Own latency + reliability SLOs','Partner with research'] },
  { id:'2', company:'Stripe',    title:'Staff Backend Engineer — Payments', location:'Remote', remote:true,  salary:'$240k – $340k', added:'1d ago', exp:'5+ yrs',  visa:'Sponsors', summary:'Scale Stripe\'s core payments infrastructure.', stack:['Ruby','Go','Kafka'], resp:['Lead cross-team initiatives'] },
  { id:'3', company:'Figma',     title:'Senior Frontend Engineer — FigJam', location:'New York, NY', remote:false, salary:'$200k – $260k', added:'2d ago', exp:'3–5 yrs', visa:'Sponsors', summary:'Own FigJam\'s collaborative whiteboard surface.', stack:['TypeScript','React','WASM'], resp:['Ship new canvas primitives'] },
  { id:'4', company:'Linear',    title:'Software Engineer — API Platform', location:'Remote', remote:true,  salary:'$180k – $240k', added:'2d ago', exp:'3–5 yrs', visa:'Sponsors', summary:'Build Linear\'s GraphQL API + SDKs.', stack:['TypeScript','GraphQL','Node'], resp:['API versioning','Rate limiting'] },
  { id:'5', company:'Vercel',    title:'Senior Infra Engineer', location:'Remote', remote:true, salary:'$210k – $290k', added:'3d ago', exp:'5+ yrs', visa:'Sponsors', summary:'Edge runtime & deployment infra.', stack:['Go','Rust','K8s'], resp:['Improve cold-start times'] },
  { id:'6', company:'Notion',    title:'Product Engineer — AI', location:'San Francisco, CA', remote:false, salary:'$190k – $260k', added:'4d ago', exp:'3–5 yrs', visa:'No', summary:'Prototype and ship AI features inside the Notion editor.', stack:['TypeScript','React'], resp:['Rapid prototyping'] },
  { id:'7', company:'Ramp',      title:'Senior Software Engineer — Growth', location:'New York, NY', remote:true, salary:'$200k – $270k', added:'5d ago', exp:'3–5 yrs', visa:'Sponsors', summary:'Drive activation + retention experiments.', stack:['TypeScript','Python','React'], resp:['A/B testing','Analytics'] },
  { id:'8', company:'OpenAI',    title:'Full-stack Engineer — ChatGPT', location:'San Francisco, CA', remote:false, salary:'$245k – $355k', added:'6d ago', exp:'3–5 yrs', visa:'Sponsors', summary:'Build the web + mobile surfaces of ChatGPT.', stack:['Next.js','TypeScript','Python'], resp:['Own end-to-end features'] },
];

const avatarColors = ['bg-violet-600','bg-blue-600','bg-emerald-600','bg-amber-600','bg-rose-600','bg-cyan-600','bg-indigo-600','bg-teal-600'];
function hashColor(s){ let h=0; for (const c of s) h = c.charCodeAt(0) + ((h<<5)-h); return avatarColors[Math.abs(h)%avatarColors.length]; }

let activeId = null; // panel closed by default

const rows = document.getElementById('rows');
function renderRows() {
  rows.innerHTML = JOBS.map(j => `
    <tr data-id="${j.id}" class="border-b border-white/[0.04] cursor-pointer ${j.id===activeId?'bg-violet-500/[0.08]':'hover:bg-white/[0.03]'}">
      <td class="px-6 py-3" onclick="event.stopPropagation()"><input type="checkbox" class="accent-violet-500"/></td>
      <td class="px-2 py-3">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-md ${hashColor(j.company)} grid place-items-center text-[11px] font-semibold">${j.company[0]}</div>
          <span class="text-xs text-slate-300 truncate max-w-[140px]">${j.company}</span>
        </div>
      </td>
      <td class="px-2 py-3 font-medium text-white">${j.title}</td>
      <td class="px-2 py-3 text-xs">
        ${j.remote
          ? '<span class="inline-flex items-center gap-1 text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-md">🌐 Remote</span>'
          : `<span class="text-slate-400">📍 ${j.location}</span>`}
      </td>
      <td class="px-2 py-3 text-xs text-amber-300">${j.salary}</td>
      <td class="px-2 py-3 text-xs text-slate-500">${j.added}</td>
    </tr>
  `).join('');
  rows.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => { openPanel(tr.dataset.id); });
  });
}

function openPanel(id){
  activeId = id; renderRows(); renderDetail();
  document.getElementById('detailPanel').classList.remove('hidden');
  document.getElementById('detailPanel').classList.add('flex');
  document.getElementById('dragHandle').classList.remove('hidden');
}
function closePanel(){
  activeId = null; renderRows();
  document.getElementById('detailPanel').classList.add('hidden');
  document.getElementById('detailPanel').classList.remove('flex');
  document.getElementById('dragHandle').classList.add('hidden');
}

function renderDetail() {
  const j = JOBS.find(x=>x.id===activeId); if (!j) return;
  document.getElementById('detailContent').innerHTML = `
    <div class="relative px-5 pt-4 pb-3 border-b border-white/[0.07]">
      <div class="absolute top-3 right-3 flex items-center gap-1">
        <button class="p-1.5 rounded-lg text-slate-400 hover:text-red-400 hover:bg-red-500/10" title="Dismiss">🗑</button>
        <button onclick="closePanel()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/[0.06]" title="Close">✕</button>
      </div>
      <div class="flex items-start gap-3 mb-3 pr-16">
        <div class="w-9 h-9 rounded-md ${hashColor(j.company)} grid place-items-center text-sm font-semibold shrink-0">${j.company[0]}</div>
        <div class="min-w-0 flex-1">
          <p class="text-base font-semibold text-white leading-tight">${j.title}</p>
          <p class="text-sm text-slate-400 mt-0.5 truncate">${j.company} · ${j.location}</p>
        </div>
      </div>
      <div class="flex flex-wrap gap-1.5 mb-3">
        ${j.remote ? '<span class="text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-md">🌐 Remote</span>' : `<span class="text-xs text-slate-400 bg-white/[0.05] border border-white/[0.07] px-2 py-0.5 rounded-md">📍 ${j.location}</span>`}
        <span class="text-xs text-amber-300 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded-md">💰 ${j.salary}</span>
        <span class="text-xs text-slate-400 bg-white/[0.05] border border-white/[0.07] px-2 py-0.5 rounded-md">💼 Full-time</span>
        <span class="text-xs text-slate-400 bg-white/[0.05] border border-white/[0.07] px-2 py-0.5 rounded-md">${j.exp}</span>
      </div>
      <div class="flex items-center gap-2">
        <button class="flex items-center gap-1.5 text-xs text-slate-300 bg-white/5 border border-white/10 px-2.5 py-1.5 rounded-lg">↗ Open</button>
        <button class="flex items-center gap-1.5 text-xs text-white bg-violet-600 hover:bg-violet-500 px-2.5 py-1.5 rounded-lg">🔖 Save</button>
        <button class="flex items-center gap-1.5 text-xs text-white bg-emerald-600 hover:bg-emerald-500 px-2.5 py-1.5 rounded-lg">✈ Applied</button>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto px-5 py-4 space-y-5 scrollbar-thin">
      <p class="text-xs text-slate-500">Added ${j.added}</p>
      <div>
        <h3 class="text-[10px] font-medium text-slate-500 uppercase tracking-wider mb-2">Summary</h3>
        <p class="text-sm text-slate-300 leading-relaxed">${j.summary}</p>
      </div>
      <div>
        <h3 class="text-[10px] font-medium text-slate-500 uppercase tracking-wider mb-2">Responsibilities</h3>
        <ul class="list-disc list-inside space-y-1">
          ${j.resp.map(r=>`<li class="text-sm text-slate-300">${r}</li>`).join('')}
        </ul>
      </div>
      <div>
        <h3 class="text-[10px] font-medium text-slate-500 uppercase tracking-wider mb-2">Tech stack</h3>
        <div class="flex flex-wrap gap-1.5">
          ${j.stack.map(s=>`<span class="text-xs bg-white/[0.07] text-slate-300 px-2 py-0.5 rounded-md font-mono">${s}</span>`).join('')}
        </div>
      </div>
    </div>
  `;
}

renderRows();

// tabs
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab .count').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  t.querySelector('.count')?.classList.add('active');
}));

// filter toggles
document.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
  b.classList.toggle('on'); b.classList.toggle('off');
}));

</script>
</body>
</html>
