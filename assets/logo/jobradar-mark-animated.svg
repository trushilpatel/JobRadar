<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="JobRadar scanning">
  <title>JobRadar</title>
  <style>
    .sweep { transform-origin: 24px 24px; animation: jr-spin 3.6s linear infinite; }
    @keyframes jr-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .sweep { animation: none; } }
  </style>
  <circle cx="24" cy="24" r="20" stroke-width="1.75"/>
  <circle cx="24" cy="24" r="11" stroke-width="1.75" opacity="0.45"/>
  <g class="sweep">
    <line x1="24" y1="24" x2="38" y2="14" stroke-width="1.75"/>
    <circle cx="38" cy="14" r="3" fill="currentColor" stroke="none"/>
  </g>
</svg>
