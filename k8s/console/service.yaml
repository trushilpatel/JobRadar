apiVersion: v1
kind: Service
metadata:
  name: jobradar-console
  namespace: jobradar-local
  labels:
    app: jobradar
    component: console
    environment: local
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30300
  selector:
    app: jobradar
    component: console
