apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: jobradar-local
  labels:
    app: jobradar
    component: kafka
    environment: local
spec:
  clusterIP: None
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
  selector:
    app: jobradar
    component: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: jobradar-local
  labels:
    app: jobradar
    component: kafka
    environment: local
spec:
  type: ClusterIP
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
  selector:
    app: jobradar
    component: kafka
