apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: jobradar-local
  labels:
    app: jobradar
    component: redis
    environment: local
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: jobradar
      component: redis
  template:
    metadata:
      labels:
        app: jobradar
        component: redis
        environment: local
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          app: jobradar
          component: redis
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
