apiVersion: v1
kind: Service
metadata:
  name: jobradar-api
  namespace: jobradar-local
  labels:
    app: jobradar
    component: api
    environment: local
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: ops
      port: 9100
      targetPort: 9100
  selector:
    app: jobradar
    component: api
