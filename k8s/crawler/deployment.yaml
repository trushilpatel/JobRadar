apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobradar-crawler
  namespace: jobradar-local
  labels:
    app: jobradar
    component: crawler
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobradar
      component: crawler
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jobradar
        component: crawler
        environment: local
    spec:
      containers:
        - name: crawler
          image: jobradar-crawler:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: jobradar-crawler-config
            - secretRef:
                name: jobradar-crawler-secret
          ports:
            - containerPort: 9101
              name: metrics
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "3Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9101
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9101
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            # Chromium (rod) runs headless with --no-sandbox in containers.
            # Needs write access to /tmp for Chrome's temp profile and shared memory.
            # SYS_ADMIN is retained for Chrome's user namespace sandboxing.
            runAsNonRoot: false
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["SYS_ADMIN"]
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        # Chrome uses /dev/shm for shared memory. The default 64Mi in K8s pods
        # causes renderer crashes — mount a tmpfs with enough headroom.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "512Mi"
      securityContext:
        runAsNonRoot: false
