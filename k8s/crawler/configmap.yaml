apiVersion: v1
kind: ConfigMap
metadata:
  name: jobradar-crawler-config
  namespace: jobradar-local
  labels:
    app: jobradar
    component: crawler
    environment: local
data:
  KAFKA_BROKERS: "kafka:9092"
  SCAN_COMPANY_DELAY_SECONDS: "30"
  CRAWLER_POLL_INTERVAL_SECONDS: "60"
  CRAWLER_STUCK_TIMEOUT_SECONDS: "120"
  CRAWLER_HEARTBEAT_INTERVAL_SECONDS: "30"

  # Google rod scraper — optimised delays (was 2-4min/page, now 15-25s)
  GOOGLE_SCRAPER_MIN_DELAY: "15000"
  GOOGLE_SCRAPER_MAX_DELAY: "25000"
  GOOGLE_SCRAPER_TIMEOUT_MS: "7200000"
  GOOGLE_SCRAPER_MAX_PAGES: "0"
  GOOGLE_SCRAPER_ENRICH_MIN: "8000"
  GOOGLE_SCRAPER_ENRICH_MAX: "12000"
  GOOGLE_SCRAPER_MAX_DETAIL_JOBS: "0"
  # GOOGLE_SCRAPER_PROFILE_DIR: ""   # mount a PVC here for persistent Chrome profile
  # CHROMIUM_PATH: ""                # auto-detected from /ms-playwright/chromium-*/chrome-linux/chrome

  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  METRICS_ADDR: ":9101"
  JAEGER_ENDPOINT: ""
  DB_SSLMODE: "require"
  DB_PORT: "5432"
