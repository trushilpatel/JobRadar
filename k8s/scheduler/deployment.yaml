apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobradar-scheduler
  namespace: jobradar-local
  labels:
    app: jobradar
    component: scheduler
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobradar
      component: scheduler
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jobradar
        component: scheduler
        environment: local
    spec:
      containers:
        - name: scheduler
          image: jobradar-backend:local
          imagePullPolicy: Never
          command: ["/app/scheduler"]
          envFrom:
            - configMapRef:
                name: jobradar-scheduler-config
            - secretRef:
                name: jobradar-scheduler-secret
          ports:
            - containerPort: 9101
              name: metrics
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9101
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9101
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        runAsNonRoot: true
