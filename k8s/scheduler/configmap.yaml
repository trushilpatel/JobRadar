apiVersion: v1
kind: ConfigMap
metadata:
  name: jobradar-scheduler-config
  namespace: jobradar-local
  labels:
    app: jobradar
    component: scheduler
    environment: local
data:
  SCAN_INTERVAL_MINUTES: "1440"
  SCHEDULER_CHECK_INTERVAL_SECONDS: "60"
  SCHEDULER_STUCK_TIMEOUT_MINUTES: "30"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  METRICS_ADDR: ":9101"
  JAEGER_ENDPOINT: ""
  DB_SSLMODE: "require"
  DB_PORT: "5432"
