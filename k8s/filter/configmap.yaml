apiVersion: v1
kind: ConfigMap
metadata:
  name: jobradar-filter-config
  namespace: jobradar-local
  labels:
    app: jobradar
    component: filter
    environment: local
data:
  KAFKA_BROKERS: "kafka:9092"
  REDIS_ADDR: "redis:6379"
  REDIS_DB: "0"
  FILTER_BATCH_SIZE: "50"
  FILTER_FLUSH_TIMEOUT_SECONDS: "30"
  FILTER_LLM_CALL_INTERVAL_SECONDS: "5"
  LLM_PROVIDER: "gemini"
  LLM_COOLDOWN_BASE_SECONDS: "60"
  LLM_COOLDOWN_MAX_SECONDS: "3600"
  LLM_COOLDOWN_JITTER: "0.2"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  METRICS_ADDR: ":9101"
  JAEGER_ENDPOINT: ""
  DB_SSLMODE: "require"
  DB_PORT: "5432"
