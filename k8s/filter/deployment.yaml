apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobradar-filter
  namespace: jobradar-local
  labels:
    app: jobradar
    component: filter
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobradar
      component: filter
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jobradar
        component: filter
        environment: local
    spec:
      containers:
        - name: filter
          image: jobradar-backend:local
          imagePullPolicy: IfNotPresent
          command: ["/app/filter"]
          envFrom:
            - configMapRef:
                name: jobradar-filter-config
            - secretRef:
                name: jobradar-filter-secret
          ports:
            - containerPort: 9101
              name: metrics
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9101
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9101
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        runAsNonRoot: true
