apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jobradar-alerting-rules
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    release: obs
spec:
  groups:
    - name: jobradar.pipeline
      rules:
        - alert: FilterDLQSpike
          expr: rate(filter_dlq_publishes_total[5m]) > 0.017
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Filter DLQ publish rate above 1/min"

        # Requires kafka_consumer_group_lag metric — needs JMX exporter enabled on Kafka brokers.
        # Stub if metric not yet exposed.
        - alert: KafkaConsumerLag
          expr: kafka_consumer_group_lag > 10000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Kafka consumer group lag above 10k messages"

        - alert: FilterLLMExhaustion
          expr: histogram_quantile(0.99, rate(filter_llm_duration_seconds_bucket[5m])) > 60
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Filter LLM p99 latency above 60s — possible rate limit or quota exhaustion"

        - alert: CrawlerScanTimeout
          expr: histogram_quantile(0.95, rate(crawler_scan_duration_seconds_bucket[5m])) > 300
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Crawler scan p95 duration above 300s"

        - alert: API5xxRate
          expr: rate(http_requests_total{status=~"5.."}[2m]) / rate(http_requests_total[2m]) > 0.01
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "API 5xx error rate above 1%"
