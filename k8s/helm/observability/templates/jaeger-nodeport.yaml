apiVersion: v1
kind: Service
metadata:
  name: jobradar-jaeger-query
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    component: jaeger
spec:
  type: NodePort
  ports:
    - name: http-query
      port: 16686
      targetPort: 16686
      nodePort: 30686
  selector:
    app.kubernetes.io/instance: obs
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: all-in-one
