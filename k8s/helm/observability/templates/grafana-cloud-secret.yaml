{{- if and .Values.grafanaCloud .Values.grafanaCloud.prom.url }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
type: Opaque
stringData:
  GRAFANA_CLOUD_PROM_URL: {{ .Values.grafanaCloud.prom.url | quote }}
  GRAFANA_CLOUD_PROM_USER: {{ .Values.grafanaCloud.prom.user | quote }}
  GRAFANA_CLOUD_PROM_TOKEN: {{ .Values.grafanaCloud.prom.token | quote }}
  GRAFANA_CLOUD_LOKI_URL: {{ .Values.grafanaCloud.loki.url | quote }}
  GRAFANA_CLOUD_LOKI_USER: {{ .Values.grafanaCloud.loki.user | quote }}
  GRAFANA_CLOUD_LOKI_TOKEN: {{ .Values.grafanaCloud.loki.token | quote }}
  GRAFANA_CLOUD_TEMPO_URL: {{ .Values.grafanaCloud.tempo.url | quote }}
  GRAFANA_CLOUD_TEMPO_USER: {{ .Values.grafanaCloud.tempo.user | quote }}
  GRAFANA_CLOUD_TEMPO_TOKEN: {{ .Values.grafanaCloud.tempo.token | quote }}
  # Pre-encoded Basic auth headers ready to drop into HTTP requests.
  GRAFANA_CLOUD_LOKI_AUTH: {{ printf "Basic %s" (printf "%s:%s" .Values.grafanaCloud.loki.user .Values.grafanaCloud.loki.token | b64enc) | quote }}
  GRAFANA_CLOUD_TEMPO_AUTH: {{ printf "Basic %s" (printf "%s:%s" .Values.grafanaCloud.tempo.user .Values.grafanaCloud.tempo.token | b64enc) | quote }}
{{- end }}
