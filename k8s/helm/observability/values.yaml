namespace: jobradar-local

# Grafana Cloud credentials. Real values live ONLY in values.local.yaml (gitignored).
# See values.local.yaml.example for the shape.
grafanaCloud:
  prom:
    url: ""
    user: ""
    token: ""
  loki:
    url: ""
    user: ""
    token: ""
  tempo:
    # OTLP endpoint, e.g. https://otlp-gateway-prod-XX.grafana.net/otlp
    url: ""
    user: ""
    token: ""

alloy:
  controller:
    type: daemonset
  alloy:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 384Mi
    # River config is mounted from our own ConfigMap (templates/alloy-config.yaml).
    # We disable the default in-chart configMap and reference ours by name.
    configMap:
      create: false
      name: jobradar-alloy-config
      key: config.alloy
    envFrom:
      - secretRef:
          name: grafana-cloud-credentials
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
    mounts:
      varlog: true
      dockercontainers: true

supabaseAuditSync:
  image:
    repository: jobradar-supabase-audit-sync
    tag: local
    pullPolicy: IfNotPresent
  intervalSeconds: "900"
  stateFile: "/var/lib/audit-sync/state.json"
  storage: 100Mi
  storageClass: local-path
