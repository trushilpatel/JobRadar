namespace: jobradar-local
environment: local

images:
  backend:
    repository: jobradar-backend
    tag: local
    pullPolicy: IfNotPresent
  console:
    repository: jobradar-console
    tag: local
    pullPolicy: IfNotPresent
  nats:
    repository: nats
    tag: "2-alpine"
    pullPolicy: IfNotPresent
  redis:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

api:
  nodePort: 30080
  metricsAddr: ":9100"
  devToken: ""          # Set locally to enable dev auth bypass. Leave empty in production.
  logLevel: info
  logFormat: json
  jaegerEndpoint: "http://obs-alloy.jobradar-local.svc.cluster.local:4318"
  dbSslmode: require
  dbPort: "6543"
  rateLimitReadRpm: "300"
  rateLimitWriteRpm: "60"
  rateLimitAdminRpm: "300"
  # Set in values.local.yaml — do not commit real values here
  supabaseProjectUrl: ""
  jwtClockSkewSeconds: "60"
  jwksCacheTtlSeconds: "600"
  apiMaxBodyBytes: "1048576"

console:
  nodePort: 30300

filter:
  natsUrl: "nats://nats:4222"
  batchSize: "50"
  flushTimeoutSeconds: "30"
  llmCallIntervalSeconds: "5"
  llmProvider: gemini
  cooldownBaseSeconds: "60"
  cooldownMaxSeconds: "3600"
  cooldownJitter: "0.2"
  logLevel: info
  logFormat: json
  metricsAddr: ":9101"
  jaegerEndpoint: "http://obs-alloy.jobradar-local.svc.cluster.local:4318"
  dbSslmode: require
  dbPort: "6543"

enricher:
  natsUrl: "nats://nats:4222"
  fetchConcurrency: "15"
  llmBatchSize: "5"
  flushTimeoutSeconds: "120"
  llmCallIntervalSeconds: "5"
  defaultRps: "2"
  defaultBurst: "3"
  jitterMs: "200"
  discardJobWithExpGt: "0"
  llmProvider: gemini
  cooldownBaseSeconds: "60"
  cooldownMaxSeconds: "3600"
  cooldownJitter: "0.2"
  logLevel: info
  logFormat: json
  metricsAddr: ":9101"
  jaegerEndpoint: "http://obs-alloy.jobradar-local.svc.cluster.local:4318"
  dbSslmode: require
  dbPort: "6543"

nats:
  url: "nats://nats:4222"    # in-cluster URL; override with Synadia Cloud URL for production
