namespace: jobradar-local
environment: local

images:
  backend:
    repository: jobradar-backend
    tag: local
    pullPolicy: IfNotPresent
  crawler:
    repository: jobradar-crawler
    tag: local
    pullPolicy: IfNotPresent
  console:
    repository: jobradar-console
    tag: local
    pullPolicy: IfNotPresent
  # nats image used only when nats.external: false (local testing without Synadia Cloud)
  nats:
    repository: nats
    tag: "2.10-alpine"
    pullPolicy: IfNotPresent
  # Redis is external (Upstash) — no in-cluster deployment

api:
  nodePort: 30080
  metricsAddr: ":9100"
  devToken: ""          # Set locally to enable dev auth bypass. Leave empty in production.
  logLevel: info
  logFormat: json
  otelEndpoint: "http://obs-alloy.jobradar-local.svc.cluster.local:4318"
  dbSslmode: require
  dbPort: "6543"
  rateLimitReadRpm: "300"
  rateLimitWriteRpm: "60"
  rateLimitAdminRpm: "300"
  # Set in values.local.yaml — do not commit real values here
  supabaseProjectUrl: ""
  jwtClockSkewSeconds: "60"
  jwksCacheTtlSeconds: "600"
  apiMaxBodyBytes: "1048576"

console:
  nodePort: 30300

filter:
  natsUrl: "tls://connect.ngs.global"
  natsCredsFile: ""   # set in values.local.yaml: path to mounted .creds file
  batchSize: "50"
  flushTimeoutSeconds: "30"
  llmCallIntervalSeconds: "5"
  llmProvider: gemini
  cooldownBaseSeconds: "60"
  cooldownMaxSeconds: "3600"
  cooldownJitter: "0.2"
  logLevel: info
  logFormat: json
  metricsAddr: ":9101"
  otelEndpoint: "http://obs-alloy.jobradar-local.svc.cluster.local:4318"
  dbSslmode: require
  dbPort: "6543"

enricher:
  natsUrl: "tls://connect.ngs.global"
  natsCredsFile: ""   # set in values.local.yaml: path to mounted .creds file
  fetchConcurrency: "15"
  llmBatchSize: "5"
  flushTimeoutSeconds: "120"
  llmCallIntervalSeconds: "5"
  defaultRps: "2"
  defaultBurst: "3"
  jitterMs: "200"
  discardJobWithExpGt: "0"
  llmProvider: gemini
  cooldownBaseSeconds: "60"
  cooldownMaxSeconds: "3600"
  cooldownJitter: "0.2"
  logLevel: info
  logFormat: json
  metricsAddr: ":9101"
  otelEndpoint: "http://obs-alloy.jobradar-local.svc.cluster.local:4318"
  dbSslmode: require
  dbPort: "6543"

crawler:
  natsUrl: "tls://connect.ngs.global"
  natsCredsFile: ""   # set in values.local.yaml: path to mounted .creds file
  pollIntervalSeconds: "60"
  stuckTimeoutSeconds: "120"
  heartbeatIntervalSeconds: "30"
  companyDelaySeconds: "30"
  scanIntervalMinutes: "1440"
  logLevel: info
  logFormat: json
  metricsAddr: ":9102"
  otelEndpoint: "http://obs-alloy.jobradar-local.svc.cluster.local:4318"
  dbSslmode: require
  dbPort: "6543"

scheduler:
  scanIntervalMinutes: "1440"
  stuckTimeoutMinutes: "30"
  checkIntervalSeconds: "60"
  logLevel: info
  logFormat: json
  metricsAddr: ":9103"
  otelEndpoint: "http://obs-alloy.jobradar-local.svc.cluster.local:4318"
  dbSslmode: require
  dbPort: "6543"

nats:
  external: true   # Synadia Cloud is the broker — no in-cluster NATS deployed
