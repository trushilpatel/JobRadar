namespace: jobradar-local
environment: local

images:
  backend:
    repository: jobradar-backend
    tag: local
    pullPolicy: IfNotPresent
  crawler:
    repository: jobradar-crawler
    tag: local
    pullPolicy: IfNotPresent
  console:
    repository: jobradar-console
    tag: local
    pullPolicy: IfNotPresent
  kafka:
    repository: docker.redpanda.com/redpandadata/redpanda
    tag: "v24.3.6"
    pullPolicy: IfNotPresent
  redis:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

api:
  nodePort: 30080
  metricsAddr: ":9100"
  devToken: ""          # Set locally to enable dev auth bypass. Leave empty in production.
  logLevel: info
  logFormat: json
  jaegerEndpoint: ""
  dbSslmode: require
  dbPort: "6543"
  redisAddr: "redis:6379"
  redisDb: "0"
  rateLimitReadRpm: "300"
  rateLimitWriteRpm: "60"
  rateLimitAdminRpm: "300"
  # Set in values.local.yaml — do not commit real values here
  supabaseProjectUrl: ""
  jwtClockSkewSeconds: "60"
  jwksCacheTtlSeconds: "600"
  apiMaxBodyBytes: "1048576"

console:
  nodePort: 30300

scheduler:
  scanIntervalMinutes: "1440"
  checkIntervalSeconds: "60"
  stuckTimeoutMinutes: "30"
  logLevel: info
  logFormat: json
  metricsAddr: ":9101"
  jaegerEndpoint: ""
  dbSslmode: require
  dbPort: "6543"

crawler:
  kafkaBrokers: "kafka:9092"
  pollIntervalSeconds: "60"
  stuckTimeoutSeconds: "120"
  heartbeatIntervalSeconds: "30"
  googleMinDelay: "20000"
  googleMaxDelay: "40000"
  googleTimeoutMs: "7200000"
  googleMaxPages: "0"
  logLevel: info
  logFormat: json
  metricsAddr: ":9101"
  jaegerEndpoint: ""
  dbSslmode: require
  dbPort: "6543"

filter:
  kafkaBrokers: "kafka:9092"
  redisAddr: "redis:6379"
  redisDb: "0"
  batchSize: "50"
  flushTimeoutSeconds: "30"
  llmCallIntervalSeconds: "5"
  llmProvider: gemini
  cooldownBaseSeconds: "60"
  cooldownMaxSeconds: "3600"
  cooldownJitter: "0.2"
  logLevel: info
  logFormat: json
  metricsAddr: ":9101"
  jaegerEndpoint: ""
  dbSslmode: require
  dbPort: "6543"

enricher:
  kafkaBrokers: "kafka:9092"
  redisAddr: "redis:6379"
  redisDb: "0"
  fetchConcurrency: "15"
  llmBatchSize: "5"
  flushTimeoutSeconds: "120"
  llmCallIntervalSeconds: "5"
  defaultRps: "2"
  defaultBurst: "3"
  jitterMs: "200"
  discardJobWithExpGt: "0"
  llmProvider: gemini
  cooldownBaseSeconds: "60"
  cooldownMaxSeconds: "3600"
  cooldownJitter: "0.2"
  logLevel: info
  logFormat: json
  metricsAddr: ":9101"
  jaegerEndpoint: ""
  dbSslmode: require
  dbPort: "6543"

kafka:
  storage: 5Gi
  storageClass: local-path
  retentionMs: "604800000"   # 7 days in ms
  memory: "400M"             # Redpanda heap; explicit cap keeps RSS ~100Mi at idle

redis:
  storage: 1Gi
  storageClass: local-path
