imagePullSecret: ""   # prod: ghcr-pull-secret

namespace: jobradar-local
environment: local

images:
  # Local dev: all backend services share the bundled jobradar-backend:local image.
  # Prod: each service has its own image (overridden in values.prod-*.yaml).
  api:
    repository: jobradar-backend
    tag: local
    pullPolicy: IfNotPresent
  scheduler:
    repository: jobradar-backend
    tag: local
    pullPolicy: IfNotPresent
  filter:
    repository: jobradar-backend
    tag: local
    pullPolicy: IfNotPresent
  enricher:
    repository: jobradar-backend
    tag: local
    pullPolicy: IfNotPresent
  orchestrator:
    repository: jobradar-orchestrator
    tag: local
    pullPolicy: IfNotPresent
  crawlerNode:
    repository: jobradar-crawler-node
    tag: local
    pullPolicy: IfNotPresent
  console:
    repository: jobradar-console
    tag: local
    pullPolicy: IfNotPresent
  # nats image used only when nats.external: false (local testing without Synadia Cloud)
  nats:
    repository: nats
    tag: "2.10-alpine"
    pullPolicy: IfNotPresent
  # Redis is external (Upstash) — no in-cluster deployment

# Schema migration Job. Runs the migrate binary bundled in the api image, so it
# can only run where that image is deployed. Disable it on nodes that don't
# carry the api image (e.g. the prod APP/pipeline node) — otherwise the Job
# renders with an unpullable api tag, never completes, and blocks `helm --wait`.
migrate:
  enabled: true

api:
  enabled: true
  nodePort: 30080
  metricsAddr: ":9100"
  devToken: ""          # Set locally to enable dev auth bypass. Leave empty in production.
  logLevel: info
  logFormat: json
  otelEndpoint: "http://obs-alloy.jobradar-local.svc.cluster.local:4318"
  dbSslmode: require
  dbPort: "5432"
  rateLimitReadRpm: "300"
  rateLimitWriteRpm: "60"
  rateLimitAdminRpm: "300"
  # Set in values.local.yaml — do not commit real values here
  clerkJwksUrl: ""
  clerkIssuerUrl: ""
  jwtClockSkewSeconds: "60"
  jwksCacheTtlSeconds: "600"
  apiMaxBodyBytes: "3145728"

console:
  enabled: true
  nodePort: 30300

filter:
  enabled: true
  natsUrl: "tls://connect.ngs.global"
  natsCredsFile: ""   # set in values.local.yaml: path to mounted .creds file
  batchSize: "50"
  flushTimeoutSeconds: "30"
  llmCallIntervalSeconds: "5"
  llmProvider: gemini
  cooldownBaseSeconds: "60"
  cooldownMaxSeconds: "3600"
  cooldownJitter: "0.2"
  logLevel: info
  logFormat: json
  metricsAddr: ":9101"
  otelEndpoint: "http://obs-alloy.jobradar-local.svc.cluster.local:4318"
  dbSslmode: require
  dbPort: "5432"

enricher:
  enabled: true
  natsUrl: "tls://connect.ngs.global"
  natsCredsFile: ""   # set in values.local.yaml: path to mounted .creds file
  # fetchConcurrency controls Stage 1 parallel HTTP fetches in the enricher.
  # Default (15) is for local benchmarking. Prod APP node overrides to 4 via
  # values.prod-app.yaml — the 1-OCPU OCI node can't sustain 15 concurrent
  # goroutines without starving CoreDNS. Developers should set 4 in
  # values.local.yaml to surface concurrency bugs that only appear at prod load.
  fetchConcurrency: "15"
  llmBatchSize: "5"
  flushTimeoutSeconds: "120"
  llmCallIntervalSeconds: "5"
  defaultRps: "2"
  defaultBurst: "3"
  jitterMs: "200"
  discardJobWithExpGt: "0"
  llmProvider: gemini
  cooldownBaseSeconds: "60"
  cooldownMaxSeconds: "3600"
  cooldownJitter: "0.2"
  logLevel: info
  logFormat: json
  metricsAddr: ":9101"
  otelEndpoint: "http://obs-alloy.jobradar-local.svc.cluster.local:4318"
  dbSslmode: require
  dbPort: "5432"

scheduler:
  enabled: true
  scanIntervalMinutes: "1440"
  stuckTimeoutMinutes: "30"
  checkIntervalSeconds: "60"
  logLevel: info
  logFormat: json
  metricsAddr: ":9103"
  otelEndpoint: "http://obs-alloy.jobradar-local.svc.cluster.local:4318"
  dbSslmode: require
  dbPort: "5432"

orchestrator:
  enabled: true
  natsUrl: "tls://connect.ngs.global"
  natsCredsFile: ""   # set in values.local.yaml: path to mounted .creds file
  logLevel: info
  logFormat: json
  metricsAddr: ":9104"
  otelEndpoint: "http://obs-alloy.jobradar-local.svc.cluster.local:4318"
  dbSslmode: require
  dbPort: "5432"

# crawlerNode: stateless HTTP workers that poll the orchestrator.
# Increase replicas to scale out concurrent crawling capacity.
crawlerNode:
  enabled: true
  replicas: 1
  # orchestratorUrl is the in-cluster Service address of the orchestrator.
  orchestratorUrl: "http://jobradar-orchestrator.jobradar-local.svc.cluster.local:8082"
  pollIntervalSeconds: "10"
  maxConcurrent: "3"
  adapterTimeoutSeconds: "600"
  httpTimeoutSeconds: "15"
  retryMaxAttempts: "3"
  logLevel: info
  otelEndpoint: "http://obs-alloy.jobradar-local.svc.cluster.local:4318"

nats:
  enabled: true
  external: true   # Synadia Cloud is the broker — no in-cluster NATS deployed
