apiVersion: v1
kind: Service
metadata:
  name: jobradar-console
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jobradar.labels" . | nindent 4 }}
    component: console
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: {{ .Values.console.nodePort }}
  selector:
    {{- include "jobradar.selectorLabels" (dict "component" "console") | nindent 4 }}
