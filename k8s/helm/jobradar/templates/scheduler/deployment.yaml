{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobradar-scheduler
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jobradar.labels" . | nindent 4 }}
    component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "jobradar.selectorLabels" (dict "component" "scheduler") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "jobradar.labels" . | nindent 8 }}
        component: scheduler
      annotations:
        deploy/scheduler-sha: {{ .Values.images.scheduler.tag | quote }}
    spec:
      # dnsPolicy Default (node's own resolv.conf, NOT CoreDNS): scheduler only
      # talks to Supabase and NATS — both external hostnames — and never
      # resolves an in-cluster Service name. This keeps it running when
      # CoreDNS crash-loops under CPU-steal/swap-thrash on this node (see
      # infra/CLAUDE.md OCI failure modes). Caveat: this pod can no longer
      # resolve *.svc.cluster.local — if it ever needs an in-cluster
      # dependency (e.g. obs-alloy for OTel export), that lookup fails, and
      # backend/common/tracing swallows the error as a one-time warning
      # (silent). Remove this line if that's ever added.
      dnsPolicy: Default
      {{- with .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: scheduler
          image: {{ .Values.images.scheduler.repository }}:{{ .Values.images.scheduler.tag }}
          imagePullPolicy: {{ .Values.images.scheduler.pullPolicy }}
          command: ["/app/scheduler"]
          envFrom:
            - configMapRef:
                name: jobradar-scheduler-config
            - secretRef:
                name: jobradar-scheduler-secret
            {{- if .Values.scheduler.otelCredsSecret }}
            - secretRef:
                name: {{ .Values.scheduler.otelCredsSecret }}
            {{- end }}
          ports:
            - containerPort: 9103
              name: metrics
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "32Mi"
              cpu: "200m"
          # timeoutSeconds is explicit (not the 1s default) and failureThreshold
          # is generous: the production node is a throttled single-OCPU instance
          # (high CPU steal / iowait), so a healthy worker can take >1s to answer
          # under load. A tight probe would kill it and churn restarts.
          livenessProbe:
            httpGet:
              path: /health
              port: 9103
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: 9103
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            {{- include "jobradar.workerSecurityContext" . | nindent 12 }}
      securityContext:
        runAsNonRoot: true
{{- end }}
