apiVersion: v1
kind: Service
metadata:
  name: jobradar-scheduler
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jobradar.labels" . | nindent 4 }}
    component: scheduler
spec:
  selector:
    {{- include "jobradar.selectorLabels" (dict "component" "scheduler") | nindent 4 }}
  ports:
    - name: metrics
      port: 9103
      targetPort: metrics
