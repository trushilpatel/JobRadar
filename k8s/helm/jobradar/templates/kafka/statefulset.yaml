apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jobradar.labels" . | nindent 4 }}
    component: kafka
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "jobradar.selectorLabels" (dict "component" "kafka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jobradar.labels" . | nindent 8 }}
        component: kafka
    spec:
      containers:
        - name: kafka
          image: {{ .Values.images.kafka.repository }}:{{ .Values.images.kafka.tag }}
          imagePullPolicy: {{ .Values.images.kafka.pullPolicy }}
          command:
            - /usr/bin/rpk
            - redpanda
            - start
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://kafka:9092
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=kafka:33145
            - --mode=dev-container
            - --smp=1
            - --memory={{ .Values.kafka.memory }}
            - --reserve-memory=0M
            - --overprovisioned
            - --default-log-level=warn
          ports:
            - containerPort: 9092
              name: broker
            - containerPort: 9644
              name: admin
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/redpanda/data
          securityContext:
            allowPrivilegeEscalation: false
      securityContext:
        runAsUser: 0
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
        labels:
          {{- include "jobradar.labels" . | nindent 10 }}
          component: kafka
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.kafka.storageClass }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
