apiVersion: v1
kind: Service
metadata:
  name: jobradar-orchestrator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jobradar.labels" . | nindent 4 }}
    component: orchestrator
spec:
  selector:
    {{- include "jobradar.selectorLabels" (dict "component" "orchestrator") | nindent 4 }}
  ports:
    - name: http
      port: 8082
      targetPort: http
    - name: metrics
      port: 9104
      targetPort: metrics
