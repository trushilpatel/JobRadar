apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobradar-filter
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jobradar.labels" . | nindent 4 }}
    component: filter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "jobradar.selectorLabels" (dict "component" "filter") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "jobradar.labels" . | nindent 8 }}
        component: filter
    spec:
      volumes:
        - name: llm-slots
          configMap:
            name: jobradar-llm-slots
        {{- if .Values.filter.natsCredsFile }}
        - name: nats-creds
          secret:
            secretName: nats-creds
        {{- end }}
      containers:
        - name: filter
          image: {{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["/app/filter"]
          envFrom:
            - configMapRef:
                name: jobradar-filter-config
            - secretRef:
                name: jobradar-filter-secret
          env:
            - name: LLM_SLOTS_CONFIG
              value: /etc/jobradar/llm-slots.yaml
          volumeMounts:
            - name: llm-slots
              mountPath: /etc/jobradar
            {{- if .Values.filter.natsCredsFile }}
            - name: nats-creds
              mountPath: /etc/nats
              readOnly: true
            {{- end }}
          ports:
            - containerPort: 9101
              name: metrics
          resources:
            requests:
              memory: "32Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9101
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9101
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          securityContext:
            {{- include "jobradar.workerSecurityContext" . | nindent 12 }}
      securityContext:
        runAsNonRoot: true
