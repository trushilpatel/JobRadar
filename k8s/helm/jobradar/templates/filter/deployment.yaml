{{- if .Values.filter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobradar-filter
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jobradar.labels" . | nindent 4 }}
    component: filter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "jobradar.selectorLabels" (dict "component" "filter") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "jobradar.labels" . | nindent 8 }}
        component: filter
      annotations:
        deploy/filter-sha: {{ .Values.images.filter.tag | quote }}
    spec:
      # dnsPolicy Default (node's own resolv.conf, NOT CoreDNS): filter only
      # talks to Supabase, NATS, and the LLM API — all external hostnames —
      # and never resolves an in-cluster Service name. This keeps it running
      # when CoreDNS crash-loops under CPU-steal/swap-thrash on this node
      # (see infra/CLAUDE.md OCI failure modes) — this is the fix for the
      # previously-observed "CoreDNS crash → LLM lookups fail" cascade.
      # Caveat: this pod can no longer resolve *.svc.cluster.local — if it
      # ever needs an in-cluster dependency (e.g. obs-alloy for OTel
      # export), that lookup fails, and backend/common/tracing swallows the
      # error as a one-time warning (silent). Remove this line if that's
      # ever added.
      dnsPolicy: Default
      {{- with .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      volumes:
        - name: llm-slots
          configMap:
            name: jobradar-llm-slots
        {{- if .Values.filter.natsCredsFile }}
        - name: nats-creds
          secret:
            secretName: nats-creds
        {{- end }}
      containers:
        - name: filter
          image: {{ .Values.images.filter.repository }}:{{ .Values.images.filter.tag }}
          imagePullPolicy: {{ .Values.images.filter.pullPolicy }}
          command: ["/app/filter"]
          envFrom:
            - configMapRef:
                name: jobradar-filter-config
            - secretRef:
                name: jobradar-filter-secret
            {{- if .Values.filter.otelCredsSecret }}
            - secretRef:
                name: {{ .Values.filter.otelCredsSecret }}
            {{- end }}
          env:
            - name: LLM_SLOTS_CONFIG
              value: /etc/jobradar/llm-slots.yaml
          volumeMounts:
            - name: llm-slots
              mountPath: /etc/jobradar
            {{- if .Values.filter.natsCredsFile }}
            - name: nats-creds
              mountPath: /etc/nats
              readOnly: true
            {{- end }}
          ports:
            - containerPort: 9101
              name: metrics
          resources:
            requests:
              memory: "32Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          # timeoutSeconds is explicit (not the 1s default) and failureThreshold
          # is generous: the production node is a throttled single-OCPU instance
          # (high CPU steal / iowait), so a healthy worker can take >1s to answer
          # under load. A tight probe would kill it and churn restarts.
          livenessProbe:
            httpGet:
              path: /health
              port: 9101
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: 9101
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            {{- include "jobradar.workerSecurityContext" . | nindent 12 }}
      securityContext:
        runAsNonRoot: true
{{- end }}
