{{- if .Values.api.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: jobradar-api-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jobradar.labels" . | nindent 4 }}
    component: api
data:
  METRICS_ADDR: {{ .Values.api.metricsAddr | quote }}
  LOG_LEVEL: {{ .Values.api.logLevel | quote }}
  LOG_FORMAT: {{ .Values.api.logFormat | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.api.otelEndpoint | quote }}
  DB_SSLMODE: {{ .Values.api.dbSslmode | quote }}
  DB_PORT: {{ .Values.api.dbPort | quote }}
  RATE_LIMIT_READ_RPM: {{ .Values.api.rateLimitReadRpm | quote }}
  RATE_LIMIT_WRITE_RPM: {{ .Values.api.rateLimitWriteRpm | quote }}
  RATE_LIMIT_ADMIN_RPM: {{ .Values.api.rateLimitAdminRpm | quote }}
  CLERK_JWKS_URL: {{ required "api.clerkJwksUrl must be set — add it to k8s/helm/jobradar/values.local.yaml." .Values.api.clerkJwksUrl | quote }}
  CLERK_ISSUER_URL: {{ required "api.clerkIssuerUrl must be set — add it to k8s/helm/jobradar/values.local.yaml." .Values.api.clerkIssuerUrl | quote }}
  JWT_CLOCK_SKEW_SECONDS: {{ .Values.api.jwtClockSkewSeconds | quote }}
  JWKS_CACHE_TTL_SECONDS: {{ .Values.api.jwksCacheTtlSeconds | quote }}
  API_MAX_BODY_BYTES: {{ .Values.api.apiMaxBodyBytes | quote }}
  DEV_TOKEN: {{ .Values.api.devToken | quote }}
{{- end }}
