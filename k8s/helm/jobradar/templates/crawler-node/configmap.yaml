apiVersion: v1
kind: ConfigMap
metadata:
  name: jobradar-crawler-node-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jobradar.labels" . | nindent 4 }}
    component: crawler-node
data:
  ORCHESTRATOR_URL: {{ .Values.crawlerNode.orchestratorUrl | quote }}
  POLL_INTERVAL_SECONDS: {{ .Values.crawlerNode.pollIntervalSeconds | quote }}
  MAX_CONCURRENT: {{ .Values.crawlerNode.maxConcurrent | quote }}
  ADAPTER_TIMEOUT_SECONDS: {{ .Values.crawlerNode.adapterTimeoutSeconds | quote }}
  HTTP_TIMEOUT_SECONDS: {{ .Values.crawlerNode.httpTimeoutSeconds | quote }}
  RETRY_MAX_ATTEMPTS: {{ .Values.crawlerNode.retryMaxAttempts | quote }}
  LOG_LEVEL: {{ .Values.crawlerNode.logLevel | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.crawlerNode.otelEndpoint | quote }}
  METRICS_ADDR: ":9102"
