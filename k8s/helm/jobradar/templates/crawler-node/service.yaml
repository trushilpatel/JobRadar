{{- if .Values.crawlerNode.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: jobradar-crawler-node-metrics
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jobradar.labels" . | nindent 4 }}
    component: crawler-node
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9102
      targetPort: 9102
  selector:
    {{- include "jobradar.selectorLabels" (dict "component" "crawler-node") | nindent 4 }}
{{- end }}
