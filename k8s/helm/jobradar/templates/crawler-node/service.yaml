{{- if .Values.crawlerNode.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: jobradar-crawler-node-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app: jobradar-crawler-node
    component: crawler-node
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9102
      targetPort: 9102
  selector:
    app: jobradar-crawler-node
{{- end }}
