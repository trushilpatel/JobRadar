{{- if .Values.crawler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobradar-crawler
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jobradar.labels" . | nindent 4 }}
    component: crawler
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "jobradar.selectorLabels" (dict "component" "crawler") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "jobradar.labels" . | nindent 8 }}
        component: crawler
      annotations:
        deploy/crawler-sha: {{ .Values.images.crawler.tag | quote }}
    spec:
      {{- with .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      volumes:
        {{- if .Values.crawler.natsCredsFile }}
        - name: nats-creds
          secret:
            secretName: nats-creds
        {{- end }}
      containers:
        - name: crawler
          image: {{ .Values.images.crawler.repository }}:{{ .Values.images.crawler.tag }}
          imagePullPolicy: {{ .Values.images.crawler.pullPolicy }}
          command: ["/app/crawler"]
          envFrom:
            - configMapRef:
                name: jobradar-crawler-config
            - secretRef:
                name: jobradar-crawler-secret
          {{- if .Values.crawler.natsCredsFile }}
          volumeMounts:
            - name: nats-creds
              mountPath: /etc/nats
              readOnly: true
          {{- end }}
          ports:
            - containerPort: 9102
              name: metrics
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          securityContext:
            {{- include "jobradar.workerSecurityContext" . | nindent 12 }}
      securityContext:
        runAsNonRoot: true
{{- end }}
