apiVersion: v1
kind: Service
metadata:
  name: jobradar-crawler
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jobradar.labels" . | nindent 4 }}
    component: crawler
spec:
  selector:
    {{- include "jobradar.selectorLabels" (dict "component" "crawler") | nindent 4 }}
  ports:
    - name: metrics
      port: 9102
      targetPort: metrics
