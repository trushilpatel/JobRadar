# Node 1 — Serving only (API + Console).
# Pipeline workers are disabled so this node handles only user-facing traffic.
# Image tags are NOT committed here — passed at deploy time via --set images.<name>.tag=<sha>

nats:
  enabled: false
  external: true

scheduler:
  enabled: false
orchestrator:
  enabled: false
crawlerNode:
  enabled: false
filter:
  enabled: false
enricher:
  enabled: false

# Grafana Cloud OTLP endpoint, direct (no in-cluster collector on this node).
# Auth (Basic) comes from the grafana-cloud-otel-creds Secret, created once via
# SSH from Doppler prod's GRAFANA_CLOUD_TEMPO_AUTH — never committed here.
api:
  otelEndpoint: "https://otlp-gateway-prod-us-west-0.grafana.net/otlp/v1/traces"
  otelCredsSecret: "grafana-cloud-otel-creds"

vmagent:
  enabled: true
  remoteWriteCredsSecret: "grafana-cloud-prom-creds"
  scrapeTargets:
    - job: "jobradar_api"
      target: "jobradar-api:9100"

imagePullSecret: ghcr-pull-secret

images:
  api:
    repository: ghcr.io/trushilpatel/jobradar-api
    tag: latest # overridden at deploy time via --set
    pullPolicy: IfNotPresent
  console:
    repository: ghcr.io/trushilpatel/jobradar-console
    tag: latest # overridden at deploy time via --set
    pullPolicy: IfNotPresent
