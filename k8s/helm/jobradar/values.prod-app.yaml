# Node 2 — Pipeline only (Scheduler + Orchestrator + CrawlerNode×3 + Filter + Enricher).
# Serving layer is disabled so this node runs only background workers.
# Image tags are NOT committed here — passed at deploy time via --set images.<name>.tag=<sha>

nats:
  enabled: false
  external: true

api:
  enabled: false
console:
  enabled: false

# NATS credentials file path — mounted from the nats-creds secret (key: jobradar.creds)
# via the deployment template volume at /etc/nats when natsCredsFile is non-empty.
filter:
  natsUrl: "tls://connect.ngs.global"
  natsCredsFile: "/etc/nats/jobradar.creds"

enricher:
  natsUrl: "tls://connect.ngs.global"
  natsCredsFile: "/etc/nats/jobradar.creds"

orchestrator:
  natsUrl: "tls://connect.ngs.global"
  natsCredsFile: "/etc/nats/jobradar.creds"

crawlerNode:
  replicas: 3

imagePullSecret: ghcr-pull-secret

images:
  backend:
    repository: ghcr.io/trushilpatel/jobradar-backend
    tag: latest # overridden at deploy time via --set
    pullPolicy: IfNotPresent
  orchestrator:
    repository: ghcr.io/trushilpatel/jobradar-orchestrator
    tag: latest # overridden at deploy time via --set
    pullPolicy: IfNotPresent
  crawlerNode:
    repository: ghcr.io/trushilpatel/jobradar-crawler-node
    tag: latest # overridden at deploy time via --set
    pullPolicy: IfNotPresent
