# Node 2 — Pipeline only (Scheduler + Orchestrator + CrawlerNode×1 + Filter + Enricher).
# Serving layer is disabled so this node runs only background workers.
# Image tags are NOT committed here — passed at deploy time via --set images.<name>.tag=<sha>

# Grafana Cloud OTLP endpoint, direct (no in-cluster collector — this node's
# pipeline services use dnsPolicy: Default and can't resolve in-cluster Service
# names anyway; see the dnsPolicy comment in each deployment.yaml). Auth (Basic)
# comes from the grafana-cloud-otel-creds Secret, created once via SSH from
# Doppler prod's GRAFANA_CLOUD_TEMPO_AUTH — never committed here.
otelGrafanaCloudEndpoint: &otelGrafanaCloudEndpoint "https://otlp-gateway-prod-us-west-0.grafana.net/otlp/v1/traces"
otelGrafanaCloudCredsSecret: &otelGrafanaCloudCredsSecret "grafana-cloud-otel-creds"

nats:
  enabled: false
  external: true

api:
  enabled: false
console:
  enabled: false

# No api image is deployed on this node, so the migrate Job (which runs the
# migrate binary from the api image) cannot run here. Schema migrations run from
# the INFRA node, which carries the api image. Leaving this enabled renders a
# Job with an unpullable api tag that never completes and blocks
# `helm upgrade --wait` until it times out (the prod APP deploy failure mode).
migrate:
  enabled: false

# NATS credentials file path — mounted from the nats-creds secret (key: jobradar.creds)
# via the deployment template volume at /etc/nats when natsCredsFile is non-empty.
filter:
  natsUrl: "tls://connect.ngs.global"
  natsCredsFile: "/etc/nats/jobradar.creds"
  otelEndpoint: *otelGrafanaCloudEndpoint
  otelCredsSecret: *otelGrafanaCloudCredsSecret

enricher:
  natsUrl: "tls://connect.ngs.global"
  natsCredsFile: "/etc/nats/jobradar.creds"
  # The 1-OCPU OCI free-tier node runs at ~52% CPU steal + heavy swap. High fetch
  # concurrency spikes CPU/memory and starves CoreDNS (it misses its liveness
  # probe and restarts, dropping cluster DNS → LLM lookups fail). Keep this low on
  # this node; the base default (15) is tuned for a non-starved host.
  fetchConcurrency: "4"
  otelEndpoint: *otelGrafanaCloudEndpoint
  otelCredsSecret: *otelGrafanaCloudCredsSecret

scheduler:
  otelEndpoint: *otelGrafanaCloudEndpoint
  otelCredsSecret: *otelGrafanaCloudCredsSecret

orchestrator:
  natsUrl: "tls://connect.ngs.global"
  natsCredsFile: "/etc/nats/jobradar.creds"
  otelEndpoint: *otelGrafanaCloudEndpoint
  otelCredsSecret: *otelGrafanaCloudCredsSecret

# NATS connection budget: the external NGS (Synadia Cloud) free-tier account
# caps concurrent connections at 4. Steady-state consumers are orchestrator(1) +
# filter(1) + enricher(1) = 3, leaving room for exactly ONE crawler-node. A 2nd
# replica opens a 4th publisher connection and starves the enricher out of the
# budget ("maximum account active connections exceeded"). Keep this at 1 until
# NATS is self-hosted in-cluster (which removes the cap).
crawlerNode:
  replicas: 1
  # Lowered from the base default (3) to reduce concurrent crawl CPU/memory load
  # on the starved 1-OCPU node — see the enricher.fetchConcurrency note above.
  maxConcurrent: "2"
  otelEndpoint: *otelGrafanaCloudEndpoint
  otelCredsSecret: *otelGrafanaCloudCredsSecret

vmagent:
  enabled: true
  remoteWriteCredsSecret: "grafana-cloud-prom-creds"
  scrapeTargets:
    - job: "jobradar_scheduler"
      target: "jobradar-scheduler:9103"
    - job: "jobradar_orchestrator"
      target: "jobradar-orchestrator:9104"
    - job: "jobradar_filter"
      target: "jobradar-filter:9101"
    - job: "jobradar_enricher"
      target: "jobradar-enricher:9101"
    - job: "jobradar_crawler_node"
      target: "jobradar-crawler-node-metrics:9102"

imagePullSecret: ghcr-pull-secret

images:
  scheduler:
    repository: ghcr.io/trushilpatel/jobradar-scheduler
    tag: latest # overridden at deploy time via --set
    pullPolicy: IfNotPresent
  filter:
    repository: ghcr.io/trushilpatel/jobradar-filter
    tag: latest # overridden at deploy time via --set
    pullPolicy: IfNotPresent
  enricher:
    repository: ghcr.io/trushilpatel/jobradar-enricher
    tag: latest # overridden at deploy time via --set
    pullPolicy: IfNotPresent
  orchestrator:
    repository: ghcr.io/trushilpatel/jobradar-orchestrator
    tag: latest # overridden at deploy time via --set
    pullPolicy: IfNotPresent
  crawlerNode:
    repository: ghcr.io/trushilpatel/jobradar-crawler-node
    tag: latest # overridden at deploy time via --set
    pullPolicy: IfNotPresent
