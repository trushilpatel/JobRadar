server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Static asset caching
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt explicit pass-through so it isn't caught by SPA fallback
    location = /robots.txt {
        try_files $uri =404;
    }

    # Admin routes: strip /api prefix so /api/admin/* → /admin/* on backend
    location /api/admin/ {
        rewrite ^/api(/admin/.*)$ $1 break;
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # User API routes: preserve /api/* path (backend registers under /api/)
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
