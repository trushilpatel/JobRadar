server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Static asset caching
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt explicit pass-through so it isn't caught by SPA fallback
    location = /robots.txt {
        try_files $uri =404;
    }

    # Proxy /api/* → backend API (strip /api prefix)
    # Only used when the console is accessed DIRECTLY (dev). In prod Caddy
    # hits the API without going through nginx, so this is harmless fallback.
    location /api/ {
        proxy_pass         http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
