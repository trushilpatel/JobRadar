services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    container_name: jobradar_postgres
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-jobradar}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-jobradar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: jobradar_kafka
    ports:
      - "9092:9092"   # external (host) — SASL
    env_file:
      - ./backend/.env
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # Two listeners: SASL for external (host) use, PLAINTEXT for internal container traffic
      KAFKA_LISTENERS: SASL_PLAINTEXT://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://localhost:9092,PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - ./backend/deploy/kafka/entrypoint.sh:/entrypoint.sh
      - kafkadata:/var/lib/kafka/data
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── One-shot migration ────────────────────────────────────────────────────────

  migrate:
    image: jobradar_backend
    pull_policy: never
    container_name: jobradar_migrate
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    command: ["/app/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # ── Application services ──────────────────────────────────────────────────────

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: jobradar_backend
    container_name: jobradar_api
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BROKERS: kafka:29092
      KAFKA_USER: ""
      KAFKA_PASSWORD: ""
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "8080:8080"
    command: ["/app/api"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    image: jobradar_backend
    pull_policy: never
    container_name: jobradar_scheduler
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BROKERS: kafka:29092
      KAFKA_USER: ""
      KAFKA_PASSWORD: ""
      LOG_LEVEL: info
      LOG_FORMAT: json
      METRICS_ADDR: ":9101"
    ports:
      - "9101:9101"
    command: ["/app/scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  crawler:
    image: jobradar_backend
    pull_policy: never
    container_name: jobradar_crawler
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BROKERS: kafka:29092
      KAFKA_USER: ""
      KAFKA_PASSWORD: ""
      LOG_LEVEL: info
      LOG_FORMAT: json
      METRICS_ADDR: ":9102"
    ports:
      - "9102:9102"
    command: ["/app/crawler"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  filter:
    image: jobradar_backend
    pull_policy: never
    container_name: jobradar_filter
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BROKERS: kafka:29092
      KAFKA_USER: ""
      KAFKA_PASSWORD: ""
      LOG_LEVEL: info
      LOG_FORMAT: json
      METRICS_ADDR: ":9103"
    ports:
      - "9103:9103"
    command: ["/app/filter"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  enricher:
    image: jobradar_backend
    pull_policy: never
    container_name: jobradar_enricher
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BROKERS: kafka:29092
      KAFKA_USER: ""
      KAFKA_PASSWORD: ""
      LOG_LEVEL: info
      LOG_FORMAT: json
      METRICS_ADDR: ":9104"
    ports:
      - "9104:9104"
    command: ["/app/enricher"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Google Careers Scraper ─────────────────────────────────────────────────────

  google-scraper:
    build:
      context: ./backend/internal/ats_fetcher/google/scraper
      dockerfile: Dockerfile
    image: jobradar_google_scraper
    container_name: jobradar_google_scraper
    environment:
      GOOGLE_SCRAPER_TIMEOUT_MS: "2700000"
      GOOGLE_SCRAPER_MIN_DELAY: "30000"
      GOOGLE_SCRAPER_MAX_DELAY: "45000"
    # Not a long-running service — started on-demand by the crawler.
    # Use: docker compose run --rm google-scraper
    profiles:
      - scraper
    restart: "no"

  # ── Frontend ──────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobradar_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # ── Observability ─────────────────────────────────────────────────────────────

  loki:
    image: grafana/loki:2.9.0
    container_name: jobradar_loki
    ports:
      - "3100:3100"
    volumes:
      - ./backend/deploy/loki/loki-config.yml:/etc/loki/local-config.yaml
      - lokidata:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: jobradar_promtail
    volumes:
      - ./backend/deploy/loki/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: jobradar_grafana
    ports:
      - "3001:3000"
    volumes:
      - ./backend/deploy/loki/grafana-datasources.yml:/etc/grafana/provisioning/datasources/loki.yml
      - ./backend/deploy/prometheus/grafana-prometheus-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml
      - grafanadata:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: jobradar_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./backend/deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  lokidata:
  grafanadata:
  prometheusdata:

