services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    container_name: jobradar_postgres
    mem_limit: 256m
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-jobradar}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: postgres -c log_checkpoints=off -c log_connections=off -c log_disconnections=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-jobradar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: redpandadata/redpanda:v24.3.1
    container_name: jobradar_kafka
    user: "0"
    stop_grace_period: 30s
    volumes:
      - redpandadata:/var/lib/redpanda/data
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
      - --memory 256M
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://kafka:29092,external://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  kafka-init:
    image: redpandadata/redpanda:v24.3.1
    container_name: jobradar_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      rpk topic create job_listings.raw job_listings.filtered
      --brokers kafka:29092
      --partitions 1
      --replicas 1
    restart: "no"

  # ── One-shot migration ────────────────────────────────────────────────────────

  migrate:
    image: jobradar_backend
    pull_policy: never
    container_name: jobradar_migrate
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    command: ["/app/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # ── Application services ──────────────────────────────────────────────────────

  api:
    build:
      context: ./backend
      dockerfile: ../infra/Dockerfile
      args:
        GIT_SHA: "${GIT_SHA:-dev}"
    image: jobradar_backend
    container_name: jobradar_api
    mem_limit: 128m
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BROKERS: kafka:29092
      KAFKA_USER: ""
      KAFKA_PASSWORD: ""
      LOG_LEVEL: info
      LOG_FORMAT: json
      JAEGER_ENDPOINT: http://jaeger:4318
    ports:
      - "8080:8080"
    command: ["/app/api"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    image: jobradar_backend
    pull_policy: never
    container_name: jobradar_scheduler
    mem_limit: 128m
    profiles: [workers]
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BROKERS: kafka:29092
      KAFKA_USER: ""
      KAFKA_PASSWORD: ""
      LOG_LEVEL: info
      LOG_FORMAT: json
      METRICS_ADDR: ":9101"
      JAEGER_ENDPOINT: http://jaeger:4318
    ports:
      - "9101:9101"
    command: ["/app/scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  crawler:
    build:
      context: ./backend
      dockerfile: ../infra/Dockerfile.crawler
      args:
        GIT_SHA: "${GIT_SHA:-dev}"
    image: jobradar_crawler
    container_name: jobradar_crawler
    mem_limit: 1g
    profiles: [workers]
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BROKERS: kafka:29092
      KAFKA_USER: ""
      KAFKA_PASSWORD: ""
      LOG_LEVEL: info
      LOG_FORMAT: json
      METRICS_ADDR: ":9102"
      JAEGER_ENDPOINT: http://jaeger:4318
    ports:
      - "9102:9102"
    command: ["/app/crawler"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  filter:
    image: jobradar_backend
    pull_policy: never
    container_name: jobradar_filter
    mem_limit: 128m
    profiles: [workers]
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BROKERS: kafka:29092
      KAFKA_USER: ""
      KAFKA_PASSWORD: ""
      LOG_LEVEL: info
      LOG_FORMAT: json
      METRICS_ADDR: ":9103"
      JAEGER_ENDPOINT: http://jaeger:4318
    ports:
      - "9103:9103"
    command: ["/app/filter"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  enricher:
    image: jobradar_backend
    pull_policy: never
    container_name: jobradar_enricher
    mem_limit: 128m
    profiles: [workers]
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BROKERS: kafka:29092
      KAFKA_USER: ""
      KAFKA_PASSWORD: ""
      LOG_LEVEL: info
      LOG_FORMAT: json
      METRICS_ADDR: ":9104"
      JAEGER_ENDPOINT: http://jaeger:4318
    ports:
      - "9104:9104"
    command: ["/app/enricher"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Google Careers Scraper ─────────────────────────────────────────────────────

  google-scraper:
    build:
      context: ./backend/apps/crawler/ats/google/scraper
      dockerfile: Dockerfile
      args:
        GIT_SHA: "${GIT_SHA:-dev}"
    image: jobradar_google_scraper
    container_name: jobradar_google_scraper
    environment:
      GOOGLE_SCRAPER_TIMEOUT_MS: "14400000"   # 4 hours — matches defaultConfig()
      GOOGLE_SCRAPER_MIN_DELAY: "120000"       # 2 min — matches defaultConfig()
      GOOGLE_SCRAPER_MAX_DELAY: "240000"       # 4 min — matches defaultConfig()
      GOOGLE_SCRAPER_ENRICH_MIN: "60000"       # 1 min — matches defaultConfig()
      GOOGLE_SCRAPER_ENRICH_MAX: "120000"      # 2 min — matches defaultConfig()
    # Not a long-running service — started on-demand by the crawler.
    # Use: docker compose run --rm google-scraper
    profiles:
      - scraper
    restart: "no"

  # ── Frontend ──────────────────────────────────────────────────────────────────

  console:
    build:
      context: ./ui/console
      dockerfile: Dockerfile
      args:
        GIT_SHA: "${GIT_SHA:-dev}"
    container_name: jobradar_console
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # ── Observability ─────────────────────────────────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jobradar_jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: jobradar_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped

  # grafana:
  #   image: grafana/grafana:10.4.0
  #   container_name: jobradar_grafana
  #   ports:
  #     - "3001:3000"
  #   volumes:
  #     - ./infra/prometheus/grafana-prometheus-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml
  #     - grafanadata:/var/lib/grafana
  #   environment:
  #     - GF_AUTH_ANONYMOUS_ENABLED=true
  #     - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
  #   depends_on:
  #     - prometheus
  #   restart: unless-stopped

volumes:
  pgdata:
  prometheusdata:
  grafanadata:
  redpandadata:

