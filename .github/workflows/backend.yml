name: Backend

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - '.github/workflows/backend-lint.yml'
      - '.github/workflows/backend-test.yml'
      - '.github/.golangci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect which services changed ──────────────────────────────────────────
  # Changing platform/common/go.mod triggers all test jobs — shared deps can
  # break any service.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      crawler:         ${{ steps.filter.outputs.crawler }}
      crawler-v2:      ${{ steps.filter.outputs.crawler-v2 }}
      api-server:      ${{ steps.filter.outputs.api-server }}
      workers:         ${{ steps.filter.outputs.workers }}
      service-core:    ${{ steps.filter.outputs.service-core }}
      service-users:   ${{ steps.filter.outputs.service-users }}
      service-support: ${{ steps.filter.outputs.service-support }}
      platform:        ${{ steps.filter.outputs.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            crawler:
              - 'backend/apps/crawler/**'
            crawler-v2:
              - 'backend/apps/crawler-v2/**'
            api-server:
              - 'backend/apps/api/**'
            workers:
              - 'backend/apps/scheduler/**'
              - 'backend/apps/filter/**'
              - 'backend/apps/analyzer/**'
            service-core:
              - 'backend/service/job/**'
              - 'backend/service/scan/**'
            service-users:
              - 'backend/service/user/**'
              - 'backend/service/company/**'
              - 'backend/service/application/**'
              - 'backend/service/role/**'
            service-support:
              - 'backend/service/llm/**'
              - 'backend/service/dashboard/**'
              - 'backend/service/insights/**'
              - 'backend/service/audit/**'
            platform:
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'

  # ── Compile check ───────────────────────────────────────────────────────────
  # Fast native build of every binary — catches broken imports and missing
  # symbols before merge, without the overhead of tests or Docker.  Runs on
  # every backend PR regardless of which files changed.
  compile:
    name: compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build all binaries
        working-directory: backend
        run: |
          go build ./apps/api/...
          go build ./apps/migrate/...
          go build ./apps/scheduler/...
          go build ./apps/filter/...
          go build ./apps/analyzer/...
          go build ./apps/crawler/...
          go build ./apps/orchestrator/...
          go build ./apps/crawler-node/...

  # ── Lint (always runs — only lints changed files via --new-from-rev) ────────
  lint:
    name: lint
    uses: ./.github/workflows/backend-lint.yml
    secrets: inherit

  # ── Per-service test jobs ───────────────────────────────────────────────────
  # Parallel + change-detected for fast, granular signal.  No Codecov upload —
  # the coverage gate is enforced locally by check-coverage.sh.  The full
  # consolidated upload happens in deploy.yml on merge to main.
  test-crawler:
    name: test / crawler
    needs: changes
    if: needs.changes.outputs.crawler == 'true' || needs.changes.outputs.platform == 'true'
    uses: ./.github/workflows/backend-test.yml
    with:
      packages: ./apps/crawler/...
      flags: crawler
      artifact-name: coverage-crawler
    secrets: inherit

  test-crawler-v2:
    name: test / crawler-v2
    needs: changes
    if: needs.changes.outputs['crawler-v2'] == 'true' || needs.changes.outputs.platform == 'true'
    uses: ./.github/workflows/backend-test.yml
    with:
      packages: ./apps/crawler-v2/...
      flags: crawler-v2
      artifact-name: coverage-crawler-v2
    secrets: inherit

  test-api-server:
    name: test / api-server
    needs: changes
    if: needs.changes.outputs.api-server == 'true' || needs.changes.outputs.platform == 'true'
    uses: ./.github/workflows/backend-test.yml
    with:
      packages: ./apps/api/...
      flags: api-server
      artifact-name: coverage-api-server
    secrets: inherit

  test-workers:
    name: test / workers
    needs: changes
    if: needs.changes.outputs.workers == 'true' || needs.changes.outputs.platform == 'true'
    uses: ./.github/workflows/backend-test.yml
    with:
      packages: ./apps/scheduler/... ./apps/filter/... ./apps/analyzer/...
      flags: workers
      artifact-name: coverage-workers
    secrets: inherit

  test-service-core:
    name: test / service-core
    needs: changes
    if: needs.changes.outputs.service-core == 'true' || needs.changes.outputs.platform == 'true'
    uses: ./.github/workflows/backend-test.yml
    with:
      packages: ./service/job/... ./service/scan/...
      flags: service-core
      artifact-name: coverage-service-core
    secrets: inherit

  test-service-users:
    name: test / service-users
    needs: changes
    if: needs.changes.outputs.service-users == 'true' || needs.changes.outputs.platform == 'true'
    uses: ./.github/workflows/backend-test.yml
    with:
      packages: ./service/user/... ./service/company/... ./service/application/... ./service/role/...
      flags: service-users
      artifact-name: coverage-service-users
    secrets: inherit

  test-service-support:
    name: test / service-support
    needs: changes
    if: needs.changes.outputs.service-support == 'true' || needs.changes.outputs.platform == 'true'
    uses: ./.github/workflows/backend-test.yml
    with:
      packages: ./service/llm/... ./service/dashboard/... ./service/insights/... ./service/audit/...
      flags: service-support
      artifact-name: coverage-service-support
    secrets: inherit

  test-platform:
    name: test / platform
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    uses: ./.github/workflows/backend-test.yml
    with:
      packages: ./platform/... ./common/...
      flags: platform
      artifact-name: coverage-platform
    secrets: inherit
