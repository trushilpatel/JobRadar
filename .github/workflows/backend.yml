name: Backend

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - '.github/workflows/backend-lint.yml'
      - '.github/.golangci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Compile check ───────────────────────────────────────────────────────────
  compile:
    name: compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build all binaries
        working-directory: backend
        run: |
          go build ./apps/api/...
          go build ./apps/migrate/...
          go build ./apps/scheduler/...
          go build ./apps/filter/...
          go build ./apps/analyzer/...
          go build ./apps/orchestrator/...
          go build ./apps/crawler-node/...

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: lint
    uses: ./.github/workflows/backend-lint.yml
    secrets: inherit
