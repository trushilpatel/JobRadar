name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend / lint
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend
          args: --config ../.github/.golangci.yml --new-from-rev=origin/main --timeout 5m --path-mode=abs

      - name: Regenerate OpenAPI spec and check for drift
        # Fails the build if apps/api/openapi.yaml doesn't match what the API
        # actually serves — the spec can never silently drift from the code.
        # See docs/superpowers/plans/2026-06-13-huma-migration-plan.md, Section 3.5.
        run: |
          go run ./apps/api --print-spec
          git diff --exit-code -- apps/api/openapi.yaml
        working-directory: backend

  backend-test:
    name: Backend / test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Cache gotestsum
        id: gotestsum-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/gotestsum
          key: gotestsum-v1.13.0-${{ runner.os }}

      - name: Install gotestsum
        if: steps.gotestsum-cache.outputs.cache-hit != 'true'
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run unit tests
        run: |
          gotestsum --junitfile /tmp/junit.xml --format pkgname -- \
            -race -count=1 -short \
            -coverpkg=./... \
            -coverprofile=/tmp/coverage.out \
            ./...
        working-directory: backend

      - name: Enforce coverage threshold
        run: ../scripts/check-coverage.sh /tmp/coverage.out 95
        working-directory: backend

      - name: Upload coverage to Codecov
        if: always() && github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          files: /tmp/coverage.out
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: always() && github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          files: /tmp/junit.xml
          flags: backend
          report_type: test_results
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        # Non-fatal: coverage already goes to Codecov above. This artifact is only
        # for manual inspection, so an artifact-storage-quota error here must not
        # fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: /tmp/coverage.out
          if-no-files-found: ignore

  frontend-check:
    name: Console / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Test
        run: npm run test
        working-directory: frontend
