name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend / lint
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend
          args: --config ../.github/.golangci.yml --new-from-rev=origin/main --timeout 5m --path-mode=abs

      - name: Regenerate OpenAPI specs and check for drift
        # Fails the build if apps/api/openapi.yaml or apps/orchestrator/openapi.yaml
        # doesn't match what each server actually serves — the spec can never
        # silently drift from the code. See
        # docs/superpowers/plans/2026-06-13-huma-migration-plan.md, Section 3.5
        # and Section 9 (orchestrator is a separate binary/spec, not a 13th slice).
        run: |
          go run ./apps/api --print-spec
          go run ./apps/orchestrator --print-spec
          git diff --exit-code -- apps/api/openapi.yaml apps/orchestrator/openapi.yaml
        working-directory: backend

  backend-test:
    name: Backend / test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Cache gotestsum
        id: gotestsum-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/gotestsum
          key: gotestsum-v1.13.0-${{ runner.os }}

      - name: Install gotestsum
        if: steps.gotestsum-cache.outputs.cache-hit != 'true'
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run unit tests
        run: |
          gotestsum --junitfile /tmp/junit.xml --format pkgname -- \
            -race -count=1 -short \
            -coverpkg=./... \
            -coverprofile=/tmp/coverage.out \
            ./...
        working-directory: backend

      - name: Enforce coverage threshold
        run: ../scripts/check-coverage.sh /tmp/coverage.out 95
        working-directory: backend

      - name: Upload coverage to Codecov
        if: always() && github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          files: /tmp/coverage.out
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: always() && github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          files: /tmp/junit.xml
          flags: backend
          report_type: test_results
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        # Non-fatal: coverage already goes to Codecov above. This artifact is only
        # for manual inspection, so an artifact-storage-quota error here must not
        # fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: /tmp/coverage.out
          if-no-files-found: ignore

  frontend-check:
    name: Console / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-frontend

      - name: Regenerate API types and check for drift
        # Fails the build if src/lib/api/schema.gen.ts doesn't match
        # backend/apps/api/openapi.yaml — the frontend's generated types can
        # never silently drift from the backend contract. Reads the already
        # checked-out (committed) openapi.yaml; no Go build needed.
        run: |
          npm run gen:api-types
          git diff --exit-code -- src/lib/api/schema.gen.ts
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Test
        run: npm run test
        working-directory: frontend

  e2e:
    name: E2E / Playwright
    needs: [backend-lint, backend-test, frontend-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    # Every run hits the SAME shared dev Supabase DB and the SAME
    # TEST_ROLE_USER/TEST_ROLE_ADMIN Clerk accounts real developers also use
    # locally (see frontend/e2e/CLAUDE.md's "operational constraint" note) -
    # this is a deliberate tradeoff, not an oversight. No `cancel-in-progress`
    # here: a second concurrent run on this group QUEUES behind the first
    # instead of being cancelled, so two PRs' E2E runs never write to the
    # shared account at the same time. A human running the suite locally at
    # the exact moment a dev->main PR's CI is also running it is a residual,
    # accepted risk - rare in practice since main-promotion PRs are
    # infrequent.
    concurrency:
      group: e2e-shared-dev-resources
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: ./.github/actions/setup-frontend

      - name: Install Doppler CLI
        run: (curl -Ls https://cli.doppler.com/install.sh || wget -qO- https://cli.doppler.com/install.sh) | sudo sh

      - name: Run DB migrations
        run: doppler run --config dev -- go run ./apps/migrate
        working-directory: backend

      - name: Start API server
        run: |
          doppler run --config dev -- go run ./apps/api &
          echo $! > /tmp/api.pid
        working-directory: backend

      - name: Start Vite dev server
        run: |
          doppler run --config dev -- npm run dev &
          echo $! > /tmp/vite.pid
        working-directory: frontend

      - name: Wait for API and Vite to be ready
        run: |
          API_UP=""
          VITE_UP=""
          for i in $(seq 1 30); do
            curl -sf http://localhost:9100/health > /dev/null && API_UP=1 && break
            sleep 2
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ > /dev/null && VITE_UP=1 && break
            sleep 2
          done
          if [ -z "$API_UP" ] || [ -z "$VITE_UP" ]; then
            echo "API up: ${API_UP:-no}, Vite up: ${VITE_UP:-no}"
            echo "Stack failed to come up in time"
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run E2E suite
        run: npm run test:e2e
        working-directory: frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop background processes
        if: always()
        run: |
          [ -f /tmp/api.pid ] && kill "$(cat /tmp/api.pid)" 2>/dev/null || true
          [ -f /tmp/vite.pid ] && kill "$(cat /tmp/vite.pid)" 2>/dev/null || true
