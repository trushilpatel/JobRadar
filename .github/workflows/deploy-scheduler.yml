name: Deploy Scheduler

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/Dockerfile.backend"
      - "k8s/scheduler/**"
      - ".github/workflows/deploy-scheduler.yml"

jobs:
  # ── 1. Build and push image to GHCR ───────────────────────────────────────
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infra/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jobradar-backend:latest
            ghcr.io/${{ github.repository_owner }}/jobradar-backend:sha-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

