name: Console

on:
  # Run on merges to the default branch so Codecov gets a baseline coverage
  # report and test-results upload tagged to `main` — required for the Test
  # Analytics dashboard and for PR `target: auto` comparisons to have a base.
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/console.yml'
      - '.github/actions/setup-frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/console.yml'
      - '.github/actions/setup-frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: console / lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

  typecheck:
    name: console / typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

  test:
    name: console / test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-frontend

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: frontend

      # Codecov uploads happen ONLY on push to main. PRs are gated locally by the
      # vitest statement threshold (see vite.config.ts) — no upload needed — which
      # keeps the monthly Codecov upload count within the private-repo budget at
      # high merge volume. New-line coverage feedback on PRs comes from the
      # zero-upload diff-cover comment instead.
      - name: Verify Codecov token is configured
        if: always() && github.event_name == 'push'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::error::CODECOV_TOKEN secret is not set — coverage and test results will NOT reach Codecov. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: always() && github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          files: frontend/coverage/lcov.info
          flags: console
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: always() && github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          files: frontend/coverage/junit.xml
          flags: console
          report_type: test_results
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
