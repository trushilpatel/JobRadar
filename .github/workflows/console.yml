name: Console

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/console.yml'
      - '.github/actions/setup-frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: console / check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so vitest --changed origin/main can compute
          # the merge base between the PR branch and main.
          fetch-depth: 0

      - uses: ./.github/actions/setup-frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

      # PRs: vitest walks the import graph from every changed file and runs
      # only the transitively-affected tests — fast signal without full suite.
      # Full coverage runs on main push inside deploy.yml (frontend-check job).
      - name: Run affected tests
        run: npm run test:changed
        working-directory: frontend
