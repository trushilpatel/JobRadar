name: Deploy (rollback)

on:
  workflow_dispatch:
    inputs:
      node:
        description: 'Node to roll back'
        required: true
        default: both
        type: choice
        options: [infra, app, both]
      revision:
        description: 'Helm revision number (empty = roll back to previous revision)'
        required: false
        default: ''
        type: string

jobs:
  rollback-infra:
    name: Rollback INFRA node
    if: inputs.node == 'infra' || inputs.node == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.OCI_INFRA_HOST }}" >> ~/.ssh/known_hosts
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Show current Helm history (INFRA)
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm history jobradar --namespace jobradar-local"

      - name: Rollback INFRA
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ -n "$REVISION" ]]; then
            ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm rollback jobradar $REVISION \
                --namespace jobradar-local --wait --timeout 5m"
          else
            ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm rollback jobradar \
                --namespace jobradar-local --wait --timeout 5m"
          fi

  rollback-app:
    name: Rollback APP node
    if: inputs.node == 'app' || inputs.node == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.OCI_APP_HOST }}" >> ~/.ssh/known_hosts
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Show current Helm history (APP)
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm history jobradar --namespace jobradar-local"

      - name: Rollback APP
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ -n "$REVISION" ]]; then
            ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm rollback jobradar $REVISION \
                --namespace jobradar-local --wait --timeout 5m"
          else
            ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm rollback jobradar \
                --namespace jobradar-local --wait --timeout 5m"
          fi
