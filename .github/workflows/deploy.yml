name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - 'k8s/**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: trushilpatel
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Detect which source paths changed ──────────────────────────────────
  detect-changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      crawler_changed: ${{ steps.filter.outputs.crawler }}
      orch_changed: ${{ steps.filter.outputs.orchestrator }}
      node_changed: ${{ steps.filter.outputs.crawler_node }}
      console_changed: ${{ steps.filter.outputs.console }}
      any_go_changed: ${{ steps.goflags.outputs.any_go }}
      node1_changed: ${{ steps.flags.outputs.node1 }}
      node2_changed: ${{ steps.flags.outputs.node2 }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/apps/api/**'
              - 'backend/apps/filter/**'
              - 'backend/apps/enricher/**'
              - 'backend/apps/scheduler/**'
              - 'backend/apps/migrate/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.backend.ci'
            crawler:
              - 'backend/apps/crawler/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.crawler.ci'
            orchestrator:
              - 'backend/apps/orchestrator/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.orchestrator.ci'
            crawler_node:
              - 'backend/apps/crawler-node/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.crawler-node.ci'
            console:
              - 'frontend/**'

      - name: Derive compile-go flag
        id: goflags
        run: |
          if [[ "${{ steps.filter.outputs.backend }}"      == "true" || \
                "${{ steps.filter.outputs.crawler }}"      == "true" || \
                "${{ steps.filter.outputs.orchestrator }}" == "true" || \
                "${{ steps.filter.outputs.crawler_node }}" == "true" ]]; then
            echo "any_go=true" >> $GITHUB_OUTPUT
          else
            echo "any_go=false" >> $GITHUB_OUTPUT
          fi

      - name: Derive node-level flags
        id: flags
        run: |
          if [[ "${{ steps.filter.outputs.backend }}" == "true" || \
                "${{ steps.filter.outputs.console }}"  == "true" ]]; then
            echo "node1=true" >> $GITHUB_OUTPUT
          else
            echo "node1=false" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ steps.filter.outputs.backend }}"      == "true" || \
                "${{ steps.filter.outputs.crawler }}"      == "true" || \
                "${{ steps.filter.outputs.orchestrator }}" == "true" || \
                "${{ steps.filter.outputs.crawler_node }}" == "true" ]]; then
            echo "node2=true" >> $GITHUB_OUTPUT
          else
            echo "node2=false" >> $GITHUB_OUTPUT
          fi

  # ── 2. Cross-compile all Go binaries natively (linux/arm64) ───────────────
  #
  # Runs on an x86 runner at full native CPU speed — no QEMU involved.
  # All 8 binaries are compiled in one job so the module + build caches are
  # shared, eliminating redundant dependency downloads and recompilation of
  # unchanged shared packages across the four image build jobs.
  compile-go:
    name: compile go binaries (arm64)
    needs: detect-changes
    if: needs.detect-changes.outputs.any_go_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # Persist the compiled package cache between CI runs so only changed
      # packages are recompiled (saves ~60% on incremental pushes).
      - name: Restore Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-arm64-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-arm64-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-
            go-build-arm64-${{ runner.os }}-

      - name: Cross-compile all binaries (GOARCH=arm64)
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir -p /tmp/go-binaries
          go build -o /tmp/go-binaries/api          ./apps/api
          go build -o /tmp/go-binaries/migrate      ./apps/migrate
          go build -o /tmp/go-binaries/scheduler    ./apps/scheduler
          go build -o /tmp/go-binaries/filter       ./apps/filter
          go build -o /tmp/go-binaries/enricher     ./apps/analyzer
          go build -o /tmp/go-binaries/crawler      ./apps/crawler
          go build -o /tmp/go-binaries/orchestrator ./apps/orchestrator
          go build -o /tmp/go-binaries/crawler-node ./apps/crawler-node

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries-arm64
          path: /tmp/go-binaries/
          retention-days: 1

  # ── 3. Build frontend assets natively ─────────────────────────────────────
  #
  # npm ci + Vite build run on x86 without QEMU.  The built dist/ is uploaded
  # as an artifact; the Docker job just COPYs it into nginx (no Node under
  # QEMU, no secrets baked into image layers).
  build-frontend-assets:
    name: build frontend assets
    needs: detect-changes
    if: needs.detect-changes.outputs.console_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite bundle
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 4. Build backend image ─────────────────────────────────────────────────
  build-backend:
    name: build backend image
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: go-binaries-arm64
          path: /tmp/go-binaries

      - name: Stage build context
        run: |
          mkdir -p /tmp/backend-ctx
          cp /tmp/go-binaries/api /tmp/go-binaries/migrate /tmp/go-binaries/scheduler \
             /tmp/go-binaries/filter /tmp/go-binaries/enricher /tmp/backend-ctx/
          cp -r backend/migrations /tmp/backend-ctx/migrations

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: /tmp/backend-ctx
          file: infra/Dockerfile.backend.ci
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-backend:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-backend:latest
          cache-from: type=gha,scope=backend-ci
          cache-to: type=gha,scope=backend-ci,mode=max

  # ── 5. Build crawler image ─────────────────────────────────────────────────
  build-crawler:
    name: build crawler image
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.crawler_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: go-binaries-arm64
          path: /tmp/go-binaries

      - name: Stage build context
        run: |
          mkdir -p /tmp/crawler-ctx
          cp /tmp/go-binaries/crawler /tmp/crawler-ctx/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: /tmp/crawler-ctx
          file: infra/Dockerfile.crawler.ci
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-crawler:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-crawler:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-crawler:latest
          cache-from: type=gha,scope=crawler-ci
          cache-to: type=gha,scope=crawler-ci,mode=max

  # ── 6. Build orchestrator image ────────────────────────────────────────────
  build-orchestrator:
    name: build orchestrator image
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.orch_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: go-binaries-arm64
          path: /tmp/go-binaries

      - name: Stage build context
        run: |
          mkdir -p /tmp/orchestrator-ctx
          cp /tmp/go-binaries/orchestrator /tmp/orchestrator-ctx/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: /tmp/orchestrator-ctx
          file: infra/Dockerfile.orchestrator.ci
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-orchestrator:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-orchestrator:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-orchestrator:latest
          cache-from: type=gha,scope=orchestrator-ci
          cache-to: type=gha,scope=orchestrator-ci,mode=max

  # ── 7. Build crawler-node image ────────────────────────────────────────────
  build-crawler-node:
    name: build crawler-node image
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.node_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: go-binaries-arm64
          path: /tmp/go-binaries

      - name: Stage build context
        run: |
          mkdir -p /tmp/crawler-node-ctx
          cp /tmp/go-binaries/crawler-node /tmp/crawler-node-ctx/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: /tmp/crawler-node-ctx
          file: infra/Dockerfile.crawler-node.ci
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-crawler-node:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-crawler-node:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-crawler-node:latest
          cache-from: type=gha,scope=crawler-node-ci
          cache-to: type=gha,scope=crawler-node-ci,mode=max

  # ── 8. Build console image ─────────────────────────────────────────────────
  build-console:
    name: build console image
    needs: [detect-changes, build-frontend-assets]
    if: needs.detect-changes.outputs.console_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/frontend-dist

      - name: Stage build context
        run: |
          mkdir -p /tmp/console-ctx
          cp -r /tmp/frontend-dist /tmp/console-ctx/dist
          cp frontend/nginx.conf /tmp/console-ctx/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: /tmp/console-ctx
          file: frontend/Dockerfile.ci
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-console:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-console:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-console:latest
          cache-from: type=gha,scope=console-ci
          cache-to: type=gha,scope=console-ci,mode=max

  # ── 9. Deploy Node 1 (API + Console) ──────────────────────────────────────
  deploy-node1:
    name: deploy node1 (serving)
    needs:
      - detect-changes
      - build-backend
      - build-console
    if: |
      always() &&
      needs.detect-changes.outputs.node1_changed == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.OCI_INFRA_HOST }}" >> ~/.ssh/known_hosts

      - name: Resolve image tags for Node 1
        id: tags
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"

          if [ "${{ needs.build-backend.result }}" == "success" ]; then
            BACKEND_TAG="$SHORT_SHA"
          else
            BACKEND_TAG=$(ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm get values jobradar --all -o json 2>/dev/null \
              | jq -r '.images.backend.tag // \"latest\"'")
          fi

          if [ "${{ needs.build-console.result }}" == "success" ]; then
            CONSOLE_TAG="$SHORT_SHA"
          else
            CONSOLE_TAG=$(ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm get values jobradar --all -o json 2>/dev/null \
              | jq -r '.images.console.tag // \"latest\"'")
          fi

          echo "backend=$BACKEND_TAG" >> $GITHUB_OUTPUT
          echo "console=$CONSOLE_TAG" >> $GITHUB_OUTPUT

      - name: Copy chart and values to Node 1
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 -r k8s/helm/jobradar "$USER@$HOST:/tmp/jobradar-chart"
          scp -i ~/.ssh/id_ed25519 k8s/helm/jobradar/values.prod-infra.yaml "$USER@$HOST:/tmp/"

      - name: Helm upgrade Node 1
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install jobradar /tmp/jobradar-chart \
              --namespace jobradar-local \
              --create-namespace \
              -f /tmp/values.prod-infra.yaml \
              --set images.backend.tag=${{ steps.tags.outputs.backend }} \
              --set images.console.tag=${{ steps.tags.outputs.console }} \
              --set api.supabaseProjectUrl=${{ secrets.VITE_SUPABASE_URL }} \
              --wait --timeout 5m"

  # ── 10. Deploy Node 2 (Pipeline) ──────────────────────────────────────────
  deploy-node2:
    name: deploy node2 (pipeline)
    needs:
      - detect-changes
      - build-backend
      - build-crawler
      - build-orchestrator
      - build-crawler-node
    if: |
      always() &&
      needs.detect-changes.outputs.node2_changed == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.OCI_APP_HOST }}" >> ~/.ssh/known_hosts

      - name: Resolve image tags for Node 2
        id: tags
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"

          get_tag() {
            local result="$1"
            local key="$2"
            if [ "$result" == "success" ]; then
              echo "$SHORT_SHA"
            else
              ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
                "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm get values jobradar --all -o json 2>/dev/null \
                | jq -r \".images.${key}.tag // \\\"latest\\\"\""
            fi
          }

          echo "backend=$(get_tag '${{ needs.build-backend.result }}' backend)" >> $GITHUB_OUTPUT
          echo "crawler=$(get_tag '${{ needs.build-crawler.result }}' crawler)" >> $GITHUB_OUTPUT
          echo "orchestrator=$(get_tag '${{ needs.build-orchestrator.result }}' orchestrator)" >> $GITHUB_OUTPUT
          echo "crawler_node=$(get_tag '${{ needs.build-crawler-node.result }}' crawlerNode)" >> $GITHUB_OUTPUT

      - name: Copy chart and values to Node 2
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 -r k8s/helm/jobradar "$USER@$HOST:/tmp/jobradar-chart"
          scp -i ~/.ssh/id_ed25519 k8s/helm/jobradar/values.prod-app.yaml "$USER@$HOST:/tmp/"

      - name: Helm upgrade Node 2
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install jobradar /tmp/jobradar-chart \
              --namespace jobradar-local \
              --create-namespace \
              -f /tmp/values.prod-app.yaml \
              --set images.backend.tag=${{ steps.tags.outputs.backend }} \
              --set images.crawler.tag=${{ steps.tags.outputs.crawler }} \
              --set images.orchestrator.tag=${{ steps.tags.outputs.orchestrator }} \
              --set images.crawlerNode.tag=${{ steps.tags.outputs.crawler_node }} \
              --wait --timeout 5m"
