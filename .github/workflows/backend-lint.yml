on:
  workflow_call:

jobs:
  run:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: backend
          args: --config ../.github/.golangci.yml --new-from-rev=origin/main --timeout 5m --path-mode=abs
