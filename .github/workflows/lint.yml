name: Lint

# Runs on every push to an open PR targeting main
on:
  pull_request:
    branches: [main]

jobs:
  # ── Go lint ──────────────────────────────────────────────────────────────────
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 1 = shallow clone (only latest commit, not full git history)
      # Faster checkout, especially as the repo grows
      # fetch-depth: 0 = full history so --new-from-rev=origin/main can diff
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Go version from go.mod
      # cache: false — golangci-lint-action manages its own cache for modules +
      # build cache + lint results, so setup-go caching would double up
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      # golangci-lint-action caches three things automatically:
      #   1. The golangci-lint binary itself
      #   2. ~/go/pkg/mod (module downloads)
      #   3. ~/.cache/go-build (compiled packages)
      # On a cache hit, repeat runs on unchanged code take ~10-20s
      # v7 is required for golangci-lint v2 (v6 only supports v1)
      # --path-mode=abs required when using working-directory in v7
      # --new-from-rev=origin/main lints only files changed vs main
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: backend
          args: --config ../.github/.golangci.yml --new-from-rev=origin/main --timeout 5m --path-mode=abs

      - name: Run unit tests (race + coverage)
        run: |
          go test -race -count=1 -short \
            -coverpkg=./... -coverprofile=/tmp/coverage.out \
            ./...
        working-directory: backend

      - name: Enforce per-package coverage threshold
        run: ../scripts/check-coverage.sh /tmp/coverage.out 80
        working-directory: backend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: /tmp/coverage.out
          if-no-files-found: ignore

  # ── Frontend lint ─────────────────────────────────────────────────────────
  lint-console:
    name: Lint Console
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # cache: 'npm' caches ~/.npm (the global npm package cache)
      # When npm ci runs, it pulls packages from ~/.npm instead of the internet
      # Cache key is derived from package-lock.json — busts only when deps change
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/console/package-lock.json

      # npm ci = clean install from lockfile (faster + reproducible vs npm install)
      - name: Install dependencies
        run: npm ci
        working-directory: ui/console

      # ESLint uses eslint.config.js (flat config)
      - name: Run ESLint
        run: npm run lint
        working-directory: ui/console

      # Type check without emitting — catches errors ESLint misses
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: ui/console
