name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: trushilpatel
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Detect which source paths changed ──────────────────────────────────
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api:          ${{ steps.filter.outputs.api }}
      scheduler:    ${{ steps.filter.outputs.scheduler }}
      filter:       ${{ steps.filter.outputs.filter }}
      enricher:     ${{ steps.filter.outputs.enricher }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      crawler_node: ${{ steps.filter.outputs.crawler_node }}
      console:      ${{ steps.filter.outputs.console }}
      any_go:       ${{ steps.flags.outputs.any_go }}
      infra:        ${{ steps.flags.outputs.infra }}
      app:          ${{ steps.flags.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'backend/apps/api/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.api.ci'
            scheduler:
              - 'backend/apps/scheduler/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.scheduler.ci'
            filter:
              - 'backend/apps/filter/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.filter.ci'
            enricher:
              - 'backend/apps/analyzer/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.enricher.ci'
            orchestrator:
              - 'backend/apps/orchestrator/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.orchestrator.ci'
            crawler_node:
              - 'backend/apps/crawler-node/**'
              - 'backend/apps/crawler-v2/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.crawler-node.ci'
            console:
              - 'frontend/**'
              - 'infra/Dockerfile.console.ci'

      - name: Derive deploy flags
        id: flags
        run: |
          if [[ "${{ steps.filter.outputs.api }}"          == "true" || \
                "${{ steps.filter.outputs.scheduler }}"    == "true" || \
                "${{ steps.filter.outputs.filter }}"       == "true" || \
                "${{ steps.filter.outputs.enricher }}"     == "true" || \
                "${{ steps.filter.outputs.orchestrator }}" == "true" || \
                "${{ steps.filter.outputs.crawler_node }}" == "true" ]]; then
            echo "any_go=true" >> $GITHUB_OUTPUT
          else
            echo "any_go=false" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ steps.filter.outputs.api }}"    == "true" || \
                "${{ steps.filter.outputs.console }}" == "true" ]]; then
            echo "infra=true" >> $GITHUB_OUTPUT
          else
            echo "infra=false" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ steps.filter.outputs.scheduler }}"    == "true" || \
                "${{ steps.filter.outputs.filter }}"       == "true" || \
                "${{ steps.filter.outputs.enricher }}"     == "true" || \
                "${{ steps.filter.outputs.orchestrator }}" == "true" || \
                "${{ steps.filter.outputs.crawler_node }}" == "true" ]]; then
            echo "app=true" >> $GITHUB_OUTPUT
          else
            echo "app=false" >> $GITHUB_OUTPUT
          fi

  # ── 2. Compile all changed Go binaries in one job (shared module cache) ───
  compile-go:
    name: Compile Go binaries
    needs: detect-changes
    if: needs.detect-changes.outputs.any_go == 'true'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Compile all Go binaries (linux/amd64)
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p /tmp/go-binaries
          go build -o /tmp/go-binaries/api          ./apps/api
          go build -o /tmp/go-binaries/migrate      ./apps/migrate
          go build -o /tmp/go-binaries/scheduler    ./apps/scheduler
          go build -o /tmp/go-binaries/filter       ./apps/filter
          go build -o /tmp/go-binaries/enricher     ./apps/analyzer
          go build -o /tmp/go-binaries/orchestrator ./apps/orchestrator
          go build -o /tmp/go-binaries/crawler-node ./apps/crawler-node

      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries-amd64
          path: /tmp/go-binaries/
          retention-days: 1

  # ── 3. Build frontend assets ───────────────────────────────────────────────
  build-frontend-assets:
    name: Build frontend assets
    needs: detect-changes
    if: needs.detect-changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-frontend

      - name: Build Vite bundle
        working-directory: frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 4. Build images (parallel, only for changed services) ─────────────────
  build-api:
    name: Build api image
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: go-binaries-amd64
          path: /tmp/go-binaries
      - name: Stage build context
        run: |
          mkdir -p /tmp/api-ctx
          cp /tmp/go-binaries/api /tmp/go-binaries/migrate /tmp/api-ctx/
          cp -r backend/migrations /tmp/api-ctx/migrations
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/api-ctx
          file: infra/Dockerfile.api.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-api:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-api:latest
          cache-from: type=gha,scope=api-ci
          cache-to: type=gha,scope=api-ci,mode=max

  build-scheduler:
    name: Build scheduler image
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.scheduler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: go-binaries-amd64
          path: /tmp/go-binaries
      - name: Stage build context
        run: |
          mkdir -p /tmp/scheduler-ctx
          cp /tmp/go-binaries/scheduler /tmp/scheduler-ctx/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/scheduler-ctx
          file: infra/Dockerfile.scheduler.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-scheduler:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-scheduler:latest
          cache-from: type=gha,scope=scheduler-ci
          cache-to: type=gha,scope=scheduler-ci,mode=max

  build-filter:
    name: Build filter image
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: go-binaries-amd64
          path: /tmp/go-binaries
      - name: Stage build context
        run: |
          mkdir -p /tmp/filter-ctx
          cp /tmp/go-binaries/filter /tmp/filter-ctx/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/filter-ctx
          file: infra/Dockerfile.filter.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-filter:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-filter:latest
          cache-from: type=gha,scope=filter-ci
          cache-to: type=gha,scope=filter-ci,mode=max

  build-enricher:
    name: Build enricher image
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.enricher == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: go-binaries-amd64
          path: /tmp/go-binaries
      - name: Stage build context
        run: |
          mkdir -p /tmp/enricher-ctx
          cp /tmp/go-binaries/enricher /tmp/enricher-ctx/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/enricher-ctx
          file: infra/Dockerfile.enricher.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-enricher:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-enricher:latest
          cache-from: type=gha,scope=enricher-ci
          cache-to: type=gha,scope=enricher-ci,mode=max

  build-orchestrator:
    name: Build orchestrator image
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.orchestrator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: go-binaries-amd64
          path: /tmp/go-binaries
      - name: Stage build context
        run: |
          mkdir -p /tmp/orchestrator-ctx
          cp /tmp/go-binaries/orchestrator /tmp/orchestrator-ctx/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/orchestrator-ctx
          file: infra/Dockerfile.orchestrator.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-orchestrator:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-orchestrator:latest
          cache-from: type=gha,scope=orchestrator-ci
          cache-to: type=gha,scope=orchestrator-ci,mode=max

  build-crawler-node:
    name: Build crawler-node image
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.crawler_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: go-binaries-amd64
          path: /tmp/go-binaries
      - name: Stage build context
        run: |
          mkdir -p /tmp/crawler-node-ctx
          cp /tmp/go-binaries/crawler-node /tmp/crawler-node-ctx/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/crawler-node-ctx
          file: infra/Dockerfile.crawler-node.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-crawler-node:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-crawler-node:latest
          cache-from: type=gha,scope=crawler-node-ci
          cache-to: type=gha,scope=crawler-node-ci,mode=max

  build-console:
    name: Build console image
    needs: [detect-changes, build-frontend-assets]
    if: needs.detect-changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/frontend-dist
      - name: Stage build context
        run: |
          mkdir -p /tmp/console-ctx
          cp -r /tmp/frontend-dist /tmp/console-ctx/dist
          cp frontend/nginx.conf /tmp/console-ctx/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/console-ctx
          file: infra/Dockerfile.console.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-console:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-console:latest
          build-args: GIT_SHA=${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=console-ci
          cache-to: type=gha,scope=console-ci,mode=max

  # ── 5. Deploy INFRA node (API + Console) ─────────────────────────────────
  deploy-infra:
    name: Deploy INFRA node
    needs:
      - detect-changes
      - build-api
      - build-console
    if: |
      always() &&
      needs.detect-changes.outputs.infra == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.OCI_INFRA_HOST }}" >> ~/.ssh/known_hosts
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Resolve image tags for INFRA
        id: tags
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          CURRENT=$(ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm get values jobradar --all -o json 2>/dev/null || echo '{}'")

          if [[ "${{ needs.build-api.result }}" == "success" ]]; then
            echo "api=$SHORT_SHA" >> $GITHUB_OUTPUT
          else
            echo "api=$(echo "$CURRENT" | jq -r '.images.api.tag // "latest"')" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ needs.build-console.result }}" == "success" ]]; then
            echo "console=$SHORT_SHA" >> $GITHUB_OUTPUT
          else
            echo "console=$(echo "$CURRENT" | jq -r '.images.console.tag // "latest"')" >> $GITHUB_OUTPUT
          fi

      - name: Copy chart to INFRA
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" "rm -rf /tmp/jobradar-chart /tmp/values.prod-infra.yaml"
          scp -i ~/.ssh/id_ed25519 -r k8s/helm/jobradar "$USER@$HOST:/tmp/jobradar-chart"
          scp -i ~/.ssh/id_ed25519 k8s/helm/jobradar/values.prod-infra.yaml "$USER@$HOST:/tmp/"

      - name: Wait for k3s API (INFRA)
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml timeout 300 bash -c \
              'until kubectl get nodes 2>/dev/null | grep -q Ready; do sleep 5; done'"

      - name: Refresh GHCR pull secret (INFRA)
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl create namespace jobradar-local 2>/dev/null || true && \
             KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl create secret docker-registry ghcr-pull-secret \
               --docker-server=ghcr.io \
               --docker-username=${{ github.actor }} \
               --docker-password=${{ secrets.GITHUB_TOKEN }} \
               --namespace jobradar-local \
               --dry-run=client -o yaml | KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply --validate=false -f -"

      - name: Helm upgrade INFRA
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install jobradar /tmp/jobradar-chart \
              --namespace jobradar-local \
              --create-namespace \
              -f /tmp/values.prod-infra.yaml \
              --set images.api.tag=${{ steps.tags.outputs.api }} \
              --set images.console.tag=${{ steps.tags.outputs.console }} \
              --set api.clerkJwksUrl=${{ secrets.CLERK_JWKS_URL }} \
              --set api.clerkIssuerUrl=${{ secrets.CLERK_ISSUER_URL }} \
              --wait --timeout 10m"

  # ── 6. Deploy APP node (Pipeline) ─────────────────────────────────────────
  deploy-app:
    name: Deploy APP node
    needs:
      - detect-changes
      - build-scheduler
      - build-filter
      - build-enricher
      - build-orchestrator
      - build-crawler-node
    if: |
      always() &&
      needs.detect-changes.outputs.app == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.OCI_APP_HOST }}" >> ~/.ssh/known_hosts
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Resolve image tags for APP
        id: tags
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          CURRENT=$(ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm get values jobradar --all -o json 2>/dev/null || echo '{}'")

          resolve() {
            local result="$1" key="$2"
            if [[ "$result" == "success" ]]; then
              echo "$SHORT_SHA"
            else
              echo "$CURRENT" | jq -r ".images.${key}.tag // \"latest\""
            fi
          }

          echo "scheduler=$(resolve    '${{ needs.build-scheduler.result }}'    scheduler)"    >> $GITHUB_OUTPUT
          echo "filter=$(resolve       '${{ needs.build-filter.result }}'       filter)"       >> $GITHUB_OUTPUT
          echo "enricher=$(resolve     '${{ needs.build-enricher.result }}'     enricher)"     >> $GITHUB_OUTPUT
          echo "orchestrator=$(resolve '${{ needs.build-orchestrator.result }}' orchestrator)" >> $GITHUB_OUTPUT
          echo "crawler_node=$(resolve '${{ needs.build-crawler-node.result }}' crawlerNode)"  >> $GITHUB_OUTPUT

      - name: Copy chart to APP
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" "rm -rf /tmp/jobradar-chart /tmp/values.prod-app.yaml"
          scp -i ~/.ssh/id_ed25519 -r k8s/helm/jobradar "$USER@$HOST:/tmp/jobradar-chart"
          scp -i ~/.ssh/id_ed25519 k8s/helm/jobradar/values.prod-app.yaml "$USER@$HOST:/tmp/"

      - name: Wait for k3s API (APP)
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml timeout 600 bash -c \
              'until kubectl get nodes 2>/dev/null | grep -q Ready; do sleep 5; done'"

      - name: Refresh GHCR pull secret (APP)
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl create namespace jobradar-local 2>/dev/null || true && \
             KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl create secret docker-registry ghcr-pull-secret \
               --docker-server=ghcr.io \
               --docker-username=${{ github.actor }} \
               --docker-password=${{ secrets.GITHUB_TOKEN }} \
               --namespace jobradar-local \
               --dry-run=client -o yaml | KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply --validate=false -f -"

      - name: Helm upgrade APP
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install jobradar /tmp/jobradar-chart \
              --namespace jobradar-local \
              --create-namespace \
              -f /tmp/values.prod-app.yaml \
              --set images.scheduler.tag=${{ steps.tags.outputs.scheduler }} \
              --set images.filter.tag=${{ steps.tags.outputs.filter }} \
              --set images.enricher.tag=${{ steps.tags.outputs.enricher }} \
              --set images.orchestrator.tag=${{ steps.tags.outputs.orchestrator }} \
              --set images.crawlerNode.tag=${{ steps.tags.outputs.crawler_node }} \
              --wait --timeout 10m"
