name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: trushilpatel
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Disable docker/build-push-action's build-record artifact upload — it consumes
  # the (small) Actions artifact-storage quota and, when that quota is exhausted,
  # fails the build. The build records are only diagnostic summaries.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # ── 1. Detect which source paths changed ──────────────────────────────────
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api:          ${{ steps.filter.outputs.api }}
      scheduler:    ${{ steps.filter.outputs.scheduler }}
      filter:       ${{ steps.filter.outputs.filter }}
      enricher:     ${{ steps.filter.outputs.enricher }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      crawler_node: ${{ steps.filter.outputs.crawler_node }}
      console:      ${{ steps.filter.outputs.console }}
      any_go:       ${{ steps.flags.outputs.any_go }}
      app:          ${{ steps.flags.outputs.app }}
      pipeline:     ${{ steps.flags.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'backend/apps/api/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.api.ci'
            scheduler:
              - 'backend/apps/scheduler/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.scheduler.ci'
            filter:
              - 'backend/apps/filter/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.filter.ci'
            enricher:
              - 'backend/apps/analyzer/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.enricher.ci'
            orchestrator:
              - 'backend/apps/orchestrator/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.orchestrator.ci'
            crawler_node:
              - 'backend/apps/crawler-node/**'
              - 'backend/apps/crawler-v2/**'
              - 'backend/service/**'
              - 'backend/platform/**'
              - 'backend/common/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'infra/Dockerfile.crawler-node.ci'
            console:
              - 'frontend/**'
              - 'infra/Dockerfile.console.ci'

      - name: Derive deploy flags
        id: flags
        run: |
          if [[ "${{ steps.filter.outputs.api }}"          == "true" || \
                "${{ steps.filter.outputs.scheduler }}"    == "true" || \
                "${{ steps.filter.outputs.filter }}"       == "true" || \
                "${{ steps.filter.outputs.enricher }}"     == "true" || \
                "${{ steps.filter.outputs.orchestrator }}" == "true" || \
                "${{ steps.filter.outputs.crawler_node }}" == "true" ]]; then
            echo "any_go=true" >> $GITHUB_OUTPUT
          else
            echo "any_go=false" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ steps.filter.outputs.api }}"    == "true" || \
                "${{ steps.filter.outputs.console }}" == "true" ]]; then
            echo "app=true" >> $GITHUB_OUTPUT
          else
            echo "app=false" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ steps.filter.outputs.scheduler }}"    == "true" || \
                "${{ steps.filter.outputs.filter }}"       == "true" || \
                "${{ steps.filter.outputs.enricher }}"     == "true" || \
                "${{ steps.filter.outputs.orchestrator }}" == "true" || \
                "${{ steps.filter.outputs.crawler_node }}" == "true" ]]; then
            echo "pipeline=true" >> $GITHUB_OUTPUT
          else
            echo "pipeline=false" >> $GITHUB_OUTPUT
          fi

  # ── 2. Compile all changed Go binaries in one job (shared module cache) ───
  compile-go:
    name: Compile Go binaries
    needs: detect-changes
    if: needs.detect-changes.outputs.any_go == 'true'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Compile all Go binaries (linux/amd64)
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p /tmp/go-binaries
          go build -o /tmp/go-binaries/api          ./apps/api
          go build -o /tmp/go-binaries/migrate      ./apps/migrate
          go build -o /tmp/go-binaries/scheduler    ./apps/scheduler
          go build -o /tmp/go-binaries/filter       ./apps/filter
          go build -o /tmp/go-binaries/enricher     ./apps/analyzer
          go build -o /tmp/go-binaries/orchestrator ./apps/orchestrator
          go build -o /tmp/go-binaries/crawler-node ./apps/crawler-node

      # Pass binaries to the build jobs via the Actions CACHE (separate, larger
      # quota) instead of upload-artifact, which shares the small artifact-storage
      # quota that intermittently fills and blocks the whole pipeline.
      - uses: actions/cache/save@v4
        with:
          path: /tmp/go-binaries
          key: go-binaries-${{ github.sha }}

  # ── 3. Build frontend assets ───────────────────────────────────────────────
  build-frontend-assets:
    name: Build frontend assets
    needs: detect-changes
    if: needs.detect-changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-frontend

      - name: Build Vite bundle
        working-directory: frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build

      - uses: actions/cache/save@v4
        with:
          path: frontend/dist
          key: frontend-dist-${{ github.sha }}

  # ── 4. Build images (parallel, only for changed services) ─────────────────
  build-api:
    name: Build / api
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/go-binaries
          key: go-binaries-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Stage build context
        run: |
          mkdir -p /tmp/api-ctx
          cp /tmp/go-binaries/api /tmp/go-binaries/migrate /tmp/api-ctx/
          cp -r backend/migrations /tmp/api-ctx/migrations
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/api-ctx
          file: infra/Dockerfile.api.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-api:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-api:latest
          cache-from: type=gha,scope=api-ci
          cache-to: type=gha,scope=api-ci,mode=max

  build-scheduler:
    name: Build / scheduler
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.scheduler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/go-binaries
          key: go-binaries-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Stage build context
        run: |
          mkdir -p /tmp/scheduler-ctx
          cp /tmp/go-binaries/scheduler /tmp/scheduler-ctx/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/scheduler-ctx
          file: infra/Dockerfile.scheduler.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-scheduler:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-scheduler:latest
          cache-from: type=gha,scope=scheduler-ci
          cache-to: type=gha,scope=scheduler-ci,mode=max

  build-filter:
    name: Build / filter
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/go-binaries
          key: go-binaries-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Stage build context
        run: |
          mkdir -p /tmp/filter-ctx
          cp /tmp/go-binaries/filter /tmp/filter-ctx/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/filter-ctx
          file: infra/Dockerfile.filter.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-filter:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-filter:latest
          cache-from: type=gha,scope=filter-ci
          cache-to: type=gha,scope=filter-ci,mode=max

  build-enricher:
    name: Build / enricher
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.enricher == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/go-binaries
          key: go-binaries-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Stage build context
        run: |
          mkdir -p /tmp/enricher-ctx
          cp /tmp/go-binaries/enricher /tmp/enricher-ctx/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/enricher-ctx
          file: infra/Dockerfile.enricher.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-enricher:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-enricher:latest
          cache-from: type=gha,scope=enricher-ci
          cache-to: type=gha,scope=enricher-ci,mode=max

  build-orchestrator:
    name: Build / orchestrator
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.orchestrator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/go-binaries
          key: go-binaries-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Stage build context
        run: |
          mkdir -p /tmp/orchestrator-ctx
          cp /tmp/go-binaries/orchestrator /tmp/orchestrator-ctx/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/orchestrator-ctx
          file: infra/Dockerfile.orchestrator.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-orchestrator:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-orchestrator:latest
          cache-from: type=gha,scope=orchestrator-ci
          cache-to: type=gha,scope=orchestrator-ci,mode=max

  build-crawler-node:
    name: Build / crawler-node
    needs: [detect-changes, compile-go]
    if: needs.detect-changes.outputs.crawler_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/go-binaries
          key: go-binaries-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Stage build context
        run: |
          mkdir -p /tmp/crawler-node-ctx
          cp /tmp/go-binaries/crawler-node /tmp/crawler-node-ctx/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/crawler-node-ctx
          file: infra/Dockerfile.crawler-node.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-crawler-node:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-crawler-node:latest
          cache-from: type=gha,scope=crawler-node-ci
          cache-to: type=gha,scope=crawler-node-ci,mode=max

  build-console:
    name: Build / console
    needs: [detect-changes, build-frontend-assets]
    if: needs.detect-changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/cache/restore@v4
        with:
          path: frontend/dist
          key: frontend-dist-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Stage build context
        run: |
          mkdir -p /tmp/console-ctx
          cp -r frontend/dist /tmp/console-ctx/dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/console-ctx
          file: infra/Dockerfile.console.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-console:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jobradar-console:latest
          build-args: GIT_SHA=${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=console-ci
          cache-to: type=gha,scope=console-ci,mode=max

  # ── 5. Deploy App node (Console + API) ───────────────────────────────────
  deploy-app:
    name: Deploy / App node
    needs:
      - detect-changes
      - build-api
      - build-console
    if: |
      always() &&
      needs.detect-changes.outputs.app == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.OCI_INFRA_HOST }}" >> ~/.ssh/known_hosts
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Resolve image tags for App node
        id: tags
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          CURRENT=$(ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm get values jobradar --all -o json 2>/dev/null || echo '{}'")

          if [[ "${{ needs.build-api.result }}" == "success" ]]; then
            echo "api=$SHORT_SHA" >> $GITHUB_OUTPUT
          else
            echo "api=$(echo "$CURRENT" | jq -r '.images.api.tag // "latest"')" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ needs.build-console.result }}" == "success" ]]; then
            echo "console=$SHORT_SHA" >> $GITHUB_OUTPUT
          else
            # Console not rebuilt this run — read the tag currently pinned in helm
            # values so Helm writes the same SHA again (idempotent) and rollback
            # always steps to a pinned SHA, never to the floating "latest" tag.
            CONSOLE_TAG=$(echo "$CURRENT" | jq -r '.images.console.tag // empty')
            if [[ -z "$CONSOLE_TAG" ]]; then
              # First ever deploy: read the tag directly from the running deployment.
              CONSOLE_TAG=$(ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
                "KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get deployment jobradar-console \
                  -n jobradar-local -o jsonpath='{.spec.template.spec.containers[0].image}' \
                  2>/dev/null | sed 's/.*://'" || echo "")
            fi
            if [[ -z "$CONSOLE_TAG" ]]; then
              echo "::error::Cannot resolve console image tag — no helm value and no running deployment. Deploy the console at least once first."
              exit 1
            fi
            echo "console=$CONSOLE_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Copy chart to App node
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" "rm -rf /tmp/jobradar-chart /tmp/values.prod-infra.yaml"
          scp -i ~/.ssh/id_ed25519 -r k8s/helm/jobradar "$USER@$HOST:/tmp/jobradar-chart"
          scp -i ~/.ssh/id_ed25519 k8s/helm/jobradar/values.prod-infra.yaml "$USER@$HOST:/tmp/"

      - name: Wait for k3s API (App node)
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml timeout 300 bash -c \
              'until kubectl get nodes 2>/dev/null | grep -q Ready; do sleep 5; done'"

      - name: Refresh GHCR pull secret (App node)
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl create namespace jobradar-local 2>/dev/null || true && \
             KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl create secret docker-registry ghcr-pull-secret \
               --docker-server=ghcr.io \
               --docker-username=${{ github.actor }} \
               --docker-password=${{ secrets.GITHUB_TOKEN }} \
               --namespace jobradar-local \
               --dry-run=client -o yaml | KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply --validate=false -f -"

      - name: Helm upgrade App node
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" bash -s <<'REMOTE'
          set -uo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          run_upgrade() {
            helm upgrade --install jobradar /tmp/jobradar-chart \
              --namespace jobradar-local \
              --create-namespace \
              -f /tmp/values.prod-infra.yaml \
              --set images.api.tag=${{ steps.tags.outputs.api }} \
              --set images.console.tag=${{ steps.tags.outputs.console }} \
              --set api.clerkJwksUrl=${{ secrets.CLERK_JWKS_URL }} \
              --set api.clerkIssuerUrl=${{ secrets.CLERK_ISSUER_URL }} \
              --wait --timeout 10m
          }
          # Dump why the rollout is unhappy — distinguishes a transient apiserver
          # hiccup from a pod that genuinely can't become Ready on the starved node.
          dump_diag() {
            echo "--- pods ---"
            kubectl get pods -n jobradar-local -o wide 2>/dev/null || true
            echo "--- recent warnings ---"
            kubectl get events -n jobradar-local --field-selector type=Warning \
              --sort-by=.lastTimestamp 2>/dev/null | tail -20 || true
          }
          # The 1-OCPU App node's k3s apiserver can time out a single create
          # request under rollout load ("context deadline exceeded"). Retry — a
          # failed upgrade can leave the release in pending-*, which blocks the
          # next attempt, so clear that with a rollback before retrying.
          for attempt in 1 2 3; do
            echo "Helm upgrade App node — attempt ${attempt}/3"
            if run_upgrade; then
              echo "Helm upgrade App node succeeded on attempt ${attempt}"
              exit 0
            fi
            status=$(helm status jobradar -n jobradar-local -o json 2>/dev/null | jq -r '.info.status' 2>/dev/null || echo unknown)
            echo "Attempt ${attempt} failed; release status=${status}"
            dump_diag
            case "$status" in
              pending-*) echo "Clearing stuck release before retry"; helm rollback jobradar -n jobradar-local 2>/dev/null || true ;;
            esac
            [ "$attempt" -lt 3 ] && sleep 30
          done
          echo "::error::Helm upgrade App node failed after 3 attempts — see pod/event diagnostics above"
          exit 1
          REMOTE

      # Fail loudly if the live console is still serving a stale bundle. Compares
      # the SHA baked into the running image's /version.json against the tag we
      # just deployed. This is the guard that was missing when prod silently ran
      # a months-old pre-Clerk console.
      - name: Verify console rollout
        if: needs.build-console.result == 'success'
        env:
          HOST: ${{ secrets.OCI_INFRA_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
          EXPECTED_CONSOLE: ${{ steps.tags.outputs.console }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" "EXPECTED='$EXPECTED_CONSOLE' bash -s" <<'REMOTE'
          set -euo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          kubectl rollout status deployment/jobradar-console -n jobradar-local --timeout=300s
          NODEPORT=$(kubectl get svc jobradar-console -n jobradar-local -o jsonpath='{.spec.ports[0].nodePort}')
          SERVED=""
          for _ in $(seq 1 10); do
            SERVED=$(curl -fsS "http://localhost:${NODEPORT}/version.json" 2>/dev/null | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || true)
            if [ -n "$SERVED" ] && [ "$SERVED" = "$EXPECTED" ]; then break; fi
            sleep 5
          done
          echo "console served sha='${SERVED:-<none>}' expected='${EXPECTED}'"
          if [ "$SERVED" != "$EXPECTED" ]; then
            echo "::error::Console rollout drift — live console serves '${SERVED:-<none>}' but expected '${EXPECTED}'. Stale bundle still live."
            exit 1
          fi
          echo "Console verified: serving ${EXPECTED}"
          REMOTE

  # ── 6. Deploy Pipeline node (Job Data Pipeline) ───────────────────────────
  deploy-pipeline:
    name: Deploy / Pipeline node
    needs:
      - detect-changes
      - build-scheduler
      - build-filter
      - build-enricher
      - build-orchestrator
      - build-crawler-node
    if: |
      always() &&
      needs.detect-changes.outputs.pipeline == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.OCI_APP_HOST }}" >> ~/.ssh/known_hosts
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Resolve image tags for Pipeline node
        id: tags
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          CURRENT=$(ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm get values jobradar --all -o json 2>/dev/null || echo '{}'")

          resolve() {
            local result="$1" key="$2"
            if [[ "$result" == "success" ]]; then
              echo "$SHORT_SHA"
            else
              local tag
              tag=$(echo "$CURRENT" | jq -r ".images.${key}.tag // empty")
              if [[ -z "$tag" ]]; then
                echo "::error::Cannot resolve image tag for ${key} — no helm value found. Deploy this service at least once first." >&2
                exit 1
              fi
              echo "$tag"
            fi
          }

          echo "scheduler=$(resolve    '${{ needs.build-scheduler.result }}'    scheduler)"    >> $GITHUB_OUTPUT
          echo "filter=$(resolve       '${{ needs.build-filter.result }}'       filter)"       >> $GITHUB_OUTPUT
          echo "enricher=$(resolve     '${{ needs.build-enricher.result }}'     enricher)"     >> $GITHUB_OUTPUT
          echo "orchestrator=$(resolve '${{ needs.build-orchestrator.result }}' orchestrator)" >> $GITHUB_OUTPUT
          echo "crawler_node=$(resolve '${{ needs.build-crawler-node.result }}' crawlerNode)"  >> $GITHUB_OUTPUT

      - name: Copy chart to Pipeline node
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" "rm -rf /tmp/jobradar-chart /tmp/values.prod-app.yaml"
          scp -i ~/.ssh/id_ed25519 -r k8s/helm/jobradar "$USER@$HOST:/tmp/jobradar-chart"
          scp -i ~/.ssh/id_ed25519 k8s/helm/jobradar/values.prod-app.yaml "$USER@$HOST:/tmp/"

      - name: Wait for k3s API (Pipeline node)
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml timeout 600 bash -c \
              'until kubectl get nodes 2>/dev/null | grep -q Ready; do sleep 5; done'"

      - name: Refresh GHCR pull secret (Pipeline node)
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl create namespace jobradar-local 2>/dev/null || true && \
             KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl create secret docker-registry ghcr-pull-secret \
               --docker-server=ghcr.io \
               --docker-username=${{ github.actor }} \
               --docker-password=${{ secrets.GITHUB_TOKEN }} \
               --namespace jobradar-local \
               --dry-run=client -o yaml | KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply --validate=false -f -"

      - name: Helm upgrade Pipeline node
        env:
          HOST: ${{ secrets.OCI_APP_HOST }}
          USER: ${{ secrets.OCI_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" bash -s <<'REMOTE'
          set -uo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          run_upgrade() {
            helm upgrade --install jobradar /tmp/jobradar-chart \
              --namespace jobradar-local \
              --create-namespace \
              -f /tmp/values.prod-app.yaml \
              --set images.scheduler.tag=${{ steps.tags.outputs.scheduler }} \
              --set images.filter.tag=${{ steps.tags.outputs.filter }} \
              --set images.enricher.tag=${{ steps.tags.outputs.enricher }} \
              --set images.orchestrator.tag=${{ steps.tags.outputs.orchestrator }} \
              --set images.crawlerNode.tag=${{ steps.tags.outputs.crawler_node }} \
              --wait --timeout 10m
          }
          # Dump why the rollout is unhappy — distinguishes a transient apiserver
          # hiccup from a pod that genuinely can't become Ready on the starved node.
          dump_diag() {
            echo "--- pods ---"
            kubectl get pods -n jobradar-local -o wide 2>/dev/null || true
            echo "--- recent warnings ---"
            kubectl get events -n jobradar-local --field-selector type=Warning \
              --sort-by=.lastTimestamp 2>/dev/null | tail -20 || true
          }
          # The 1-OCPU Pipeline node's k3s apiserver can time out a single create
          # request under rollout load ("context deadline exceeded"). Retry — a
          # failed upgrade can leave the release in pending-*, which blocks the
          # next attempt, so clear that with a rollback before retrying.
          for attempt in 1 2 3; do
            echo "Helm upgrade Pipeline node — attempt ${attempt}/3"
            if run_upgrade; then
              echo "Helm upgrade Pipeline node succeeded on attempt ${attempt}"
              exit 0
            fi
            status=$(helm status jobradar -n jobradar-local -o json 2>/dev/null | jq -r '.info.status' 2>/dev/null || echo unknown)
            echo "Attempt ${attempt} failed; release status=${status}"
            dump_diag
            case "$status" in
              pending-*) echo "Clearing stuck release before retry"; helm rollback jobradar -n jobradar-local 2>/dev/null || true ;;
            esac
            [ "$attempt" -lt 3 ] && sleep 30
          done
          echo "::error::Helm upgrade Pipeline node failed after 3 attempts — see pod/event diagnostics above"
          exit 1
          REMOTE
