      - name: Run unit tests (race + coverage)
        run: |
          go test -race -count=1 -short \
            -coverpkg=./service/llm/... ./service/dashboard/... ./service/insights/... ./service/audit/... \
            -coverprofile=/tmp/coverage.out \
            ./service/llm/... ./service/dashboard/... ./service/insights/... ./service/audit/...
        working-directory: backend

      - name: Enforce per-package coverage threshold
        run: ../scripts/check-coverage.sh /tmp/coverage.out 95
        working-directory: backend

      - name: Upload to Codecov
        if: always()
