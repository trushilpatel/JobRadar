      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Run unit tests (race + coverage)
        run: |
          go test -race -count=1 -short \
            -coverpkg=./apps/scheduler/... ./apps/filter/... ./apps/analyzer/... \
            -coverprofile=/tmp/coverage.out \
            ./apps/scheduler/... ./apps/filter/... ./apps/analyzer/...
        working-directory: backend

      - name: Enforce per-package coverage threshold
        run: ../scripts/check-coverage.sh /tmp/coverage.out 95
        working-directory: backend

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: /tmp/coverage.out
          flags: workers
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        if: always()
