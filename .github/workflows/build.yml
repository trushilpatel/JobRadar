name: Build & Push Images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/Dockerfile.backend"
      - "infra/Dockerfile.crawler"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Build all images regardless of changes"
        type: boolean
        default: false

jobs:
  # ── Detect which images actually need rebuilding ───────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.result.outputs.backend }}
      crawler: ${{ steps.result.outputs.crawler }}
    steps:
      - uses: actions/checkout@v4

      - name: Path filter (push only)
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - "backend/**"
              - "infra/Dockerfile.backend"
            crawler:
              - "backend/**"
              - "infra/Dockerfile.crawler"

      - name: Resolve build flags
        id: result
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "crawler=true" >> $GITHUB_OUTPUT
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> $GITHUB_OUTPUT
            echo "crawler=${{ steps.filter.outputs.crawler }}" >> $GITHUB_OUTPUT
          fi

  # ── Backend image (scheduler + filter share this) ─────────────────────────
  build-backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infra/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jobradar-backend:latest
            ghcr.io/${{ github.repository_owner }}/jobradar-backend:sha-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ── Crawler image (Playwright-based, separate Dockerfile) ─────────────────
  build-crawler:
    name: Crawler
    needs: changes
    if: needs.changes.outputs.crawler == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infra/Dockerfile.crawler
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jobradar-crawler:latest
            ghcr.io/${{ github.repository_owner }}/jobradar-crawler:sha-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=crawler
          cache-to: type=gha,mode=max,scope=crawler
