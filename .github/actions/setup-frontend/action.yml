name: Setup frontend
description: >
  Set up Node 20, restore the node_modules cache keyed on the lockfile hash, and
  run `npm ci` only on a cache miss. Shared by every console job so the install
  contract lives in one place. The caller must `actions/checkout` first.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    # Cache the installed tree itself (not just the ~/.npm download cache that
    # setup-node manages) so the install/link step is skipped when the lockfile
    # is unchanged. Keyed on OS + node major + lockfile hash.
    - name: Cache node_modules
      id: nm
      uses: actions/cache@v4
      with:
        path: frontend/node_modules
        key: nm-${{ runner.os }}-node20-${{ hashFiles('frontend/package-lock.json') }}

    - name: Install dependencies
      if: steps.nm.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash
      working-directory: frontend
